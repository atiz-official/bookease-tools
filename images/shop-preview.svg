<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Noto Sans Thai','Sukhumvit Set',-apple-system,'SF Pro',sans-serif">
  <defs>
    <filter id="phoneShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-opacity="0.16"/>
    </filter>

    <linearGradient id="bgNail3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e4d4"/>
      <stop offset="50%" stop-color="#e8d5c4"/>
      <stop offset="100%" stop-color="#c9a88e"/>
    </linearGradient>

    <radialGradient id="warmth3" cx="25%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff8e7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignetteLux" cx="50%" cy="50%" r="65%">
      <stop offset="40%" stop-color="rgba(0,0,0,0)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgba(0,0,0,1)" stop-opacity="0.24"/>
    </radialGradient>

    <pattern id="grain3" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.4" fill="#000" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1400" height="1000" fill="#fafaf7"/>

  <!-- Title -->
  <text x="60" y="60" font-size="14" font-weight="800" letter-spacing="3" fill="#9a3412">STEP 3 · DOPAMINE MOMENT</text>
  <text x="60" y="100" font-size="32" font-weight="800" fill="#0f172a">เว็บร้านที่ AI สร้างให้ · 3 variants ให้พี่เลือก</text>
  <text x="60" y="130" font-size="15" fill="#475569">Industry palette = auto-detected · merchant แค่เลือก feel ที่ชอบ · Style B locked (no clip-art)</text>
  <line x1="60" y1="160" x2="1340" y2="160" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════════════
       3 PHONE PREVIEWS · 3 variants of nail spa
       ═══════════════════════════════════════════════════════════════ -->

  <!-- Variant A: โปร่ง · Airy -->
  <g>
    <text x="240" y="218" font-size="11" font-weight="800" letter-spacing="3" fill="#94a3b8">VARIANT A</text>
    <text x="240" y="252" text-anchor="middle" font-size="32" font-weight="500" font-style="italic" fill="#0f172a" font-family="'Cormorant Garamond','Times New Roman',serif">โปร่ง · Airy</text>
    <text x="240" y="278" text-anchor="middle" font-size="12" fill="#64748b">gallery · Apple Music album cover</text>

    <g filter="url(#phoneShadow3)" transform="translate(120, 300)">
      <rect width="240" height="500" rx="32" fill="#0f172a"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#bgNail3)"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#warmth3)"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#grain3)"/>

      <!-- Status bar -->
      <text x="22" y="32" font-size="10" font-weight="700" fill="#1c1817">9:41</text>
      <text x="218" y="32" text-anchor="end" font-size="10" font-weight="700" fill="#1c1817">▰▰▰▰</text>

      <!-- Address bar -->
      <rect x="20" y="42" width="200" height="22" rx="6" fill="#fff8" stroke="#0f172a" stroke-width="0.5"/>
      <text x="120" y="56" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#1c1817">🔒  bookease.co/sabai</text>

      <!-- Brand mark · CENTER · letter-spaced wide · single line · MAX negative space -->
      <text x="120" y="252" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="8" fill="#1c1817" font-family="'Cormorant Garamond',serif">BARE NAIL SPA</text>
      <text x="120" y="272" text-anchor="middle" font-size="9" letter-spacing="3" fill="#1c1817" opacity="0.55" font-family="'Cormorant Garamond',serif">EST. 2024 · SUKHUMVIT</text>
    </g>
  </g>

  <!-- Variant B: ผ่อนคลาย · Relaxed -->
  <g>
    <text x="640" y="218" font-size="11" font-weight="800" letter-spacing="3" fill="#94a3b8">VARIANT B</text>
    <text x="640" y="252" text-anchor="middle" font-size="32" font-weight="500" font-style="italic" fill="#0f172a" font-family="'Cormorant Garamond','Times New Roman',serif">ผ่อนคลาย · Relaxed</text>
    <text x="640" y="278" text-anchor="middle" font-size="12" fill="#64748b">unhurried · breathing · soft refined</text>

    <g filter="url(#phoneShadow3)" transform="translate(520, 300)">
      <rect width="240" height="500" rx="32" fill="#0f172a"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#bgNail3)"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#warmth3)"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#grain3)"/>

      <!-- Status bar -->
      <text x="22" y="32" font-size="10" font-weight="700" fill="#1c1817">9:41</text>
      <text x="218" y="32" text-anchor="end" font-size="10" font-weight="700" fill="#1c1817">▰▰▰▰</text>

      <!-- Address bar -->
      <rect x="20" y="42" width="200" height="22" rx="6" fill="#fff8" stroke="#0f172a" stroke-width="0.5"/>
      <text x="120" y="56" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#1c1817">🔒  bookease.co/sabai</text>

      <!-- Brand mark · MIDDLE · 2-line · italic tagline · medium letter-spacing -->
      <text x="120" y="232" text-anchor="middle" font-size="13" font-weight="500" letter-spacing="5" fill="#1c1817" font-family="'Cormorant Garamond',serif">BARE NAIL SPA</text>
      <text x="120" y="256" text-anchor="middle" font-size="13" font-style="italic" font-weight="400" fill="#1c1817" opacity="0.65" font-family="'Cormorant Garamond',serif">— a quiet ritual</text>
      <line x1="100" y1="282" x2="140" y2="282" stroke="#1c1817" stroke-width="0.7" opacity="0.4"/>
      <text x="120" y="306" text-anchor="middle" font-size="9" letter-spacing="3" fill="#1c1817" opacity="0.55" font-family="'Cormorant Garamond',serif">EST. 2024 · SUKHUMVIT</text>
    </g>
  </g>

  <!-- Variant C: หรูหรา · Luxury -->
  <g>
    <text x="1040" y="218" font-size="11" font-weight="800" letter-spacing="3" fill="#94a3b8">VARIANT C</text>
    <text x="1040" y="252" text-anchor="middle" font-size="32" font-weight="500" font-style="italic" fill="#0f172a" font-family="'Cormorant Garamond','Times New Roman',serif">หรูหรา · Luxury</text>
    <text x="1040" y="278" text-anchor="middle" font-size="12" fill="#64748b">Vogue · boutique hotel · refined</text>

    <g filter="url(#phoneShadow3)" transform="translate(920, 300)">
      <rect width="240" height="500" rx="32" fill="#0f172a"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#bgNail3)"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#warmth3)"/>
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#grain3)"/>

      <!-- Vignette · MORE pronounced for luxury -->
      <rect x="6" y="6" width="228" height="488" rx="26" fill="url(#vignetteLux)"/>

      <!-- Status bar -->
      <text x="22" y="32" font-size="10" font-weight="700" fill="#1c1817">9:41</text>
      <text x="218" y="32" text-anchor="end" font-size="10" font-weight="700" fill="#1c1817">▰▰▰▰</text>

      <!-- Address bar -->
      <rect x="20" y="42" width="200" height="22" rx="6" fill="#fff8" stroke="#0f172a" stroke-width="0.5"/>
      <text x="120" y="56" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#1c1817">🔒  bookease.co/sabai</text>

      <!-- Brand mark · CENTER-LOWER · italic serif · refined -->
      <text x="120" y="356" text-anchor="middle" font-size="13" font-weight="500" letter-spacing="6" fill="#1c1817" font-family="'Cormorant Garamond',serif">BARE NAIL SPA</text>
      <line x1="92" y1="376" x2="148" y2="376" stroke="#1c1817" stroke-width="0.6" opacity="0.45"/>
      <text x="120" y="400" text-anchor="middle" font-size="13" font-style="italic" font-weight="400" fill="#1c1817" opacity="0.78" font-family="'Cormorant Garamond',serif">— bangkok</text>
      <text x="120" y="430" text-anchor="middle" font-size="8" letter-spacing="3" fill="#1c1817" opacity="0.55" font-family="'Cormorant Garamond',serif">EST. 2024</text>
    </g>
  </g>

  <!-- ═══ Tab switcher (under phones) ═══ -->
  <g transform="translate(420, 836)">
    <text x="280" y="0" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#64748b">PICK A FEELING</text>

    <rect x="0" y="20" width="560" height="60" rx="30" fill="#f1f5f9" stroke="#e2e8f0"/>

    <rect x="6" y="26" width="184" height="48" rx="24" fill="#0f172a"/>
    <text x="98" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="'Cormorant Garamond',serif" font-style="italic">A · โปร่ง · Airy</text>

    <text x="282" y="56" text-anchor="middle" font-size="14" font-weight="500" fill="#475569" font-family="'Cormorant Garamond',serif" font-style="italic">B · ผ่อนคลาย · Relaxed</text>

    <text x="466" y="56" text-anchor="middle" font-size="14" font-weight="500" fill="#475569" font-family="'Cormorant Garamond',serif" font-style="italic">C · หรูหรา · Luxury</text>
  </g>

  <!-- Bottom note -->
  <rect x="60" y="930" width="1280" height="48" rx="10" fill="#1e293b"/>
  <text x="700" y="960" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">
    <tspan fill="#fcd34d" font-weight="800">RULE:</tspan>  ทุก variant ใช้ industry palette เดียวกัน · merchant ไม่เคยเลือกสี · ไม่เคยเลือก font · แค่เลือก feel
  </text>
</svg>
