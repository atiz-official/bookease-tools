<svg viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Noto Sans Thai','Sukhumvit Set',-apple-system,'SF Pro',sans-serif">
  <defs>
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
    <filter id="phoneShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1400" height="920" fill="#f1f5f9"/>

  <!-- Title -->
  <text x="60" y="60" font-size="14" font-weight="800" letter-spacing="3" fill="#047857">STEP 8 · MONEY SHOT</text>
  <text x="60" y="100" font-size="32" font-weight="800" fill="#0f172a">โอนเงิน ฿200 → SMS เข้าแอปธนาคารใน 10 วินาที</text>
  <text x="60" y="130" font-size="15" fill="#475569">Xendit dashboard · 3 ขั้น Submit → Validate → Approve · spa ได้ SMS ทันที (KBank verified 2026-04-30)</text>
  <line x1="60" y1="160" x2="1340" y2="160" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ═══ Step 1: Xendit form ═══ -->
  <text x="60" y="200" font-size="12" font-weight="800" letter-spacing="2" fill="#3b82f6">XENDIT DASHBOARD · STEP 1 OF 3</text>
  <text x="60" y="226" font-size="20" font-weight="700" fill="#0f172a">Submit · กรอก single disbursement form</text>

  <g filter="url(#cardShadow2)">
    <rect x="60" y="250" width="420" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Window chrome -->
    <rect x="60" y="250" width="420" height="42" rx="14" fill="#f8fafc"/>
    <rect x="60" y="280" width="420" height="12" fill="#f8fafc"/>
    <circle cx="80" cy="271" r="5" fill="#ef4444"/>
    <circle cx="96" cy="271" r="5" fill="#fbbf24"/>
    <circle cx="112" cy="271" r="5" fill="#10b981"/>
    <text x="270" y="276" text-anchor="middle" font-size="12" fill="#64748b">dashboard.xendit.co</text>

    <!-- Tab indicator -->
    <rect x="80" y="312" width="140" height="32" rx="8" fill="#dbeafe"/>
    <text x="150" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Disbursements</text>

    <!-- Form heading -->
    <text x="80" y="378" font-size="16" font-weight="800" fill="#0f172a">Single disbursement</text>

    <!-- Field rows -->
    <text x="80" y="412" font-size="11" font-weight="600" fill="#64748b">Recipient bank</text>
    <rect x="80" y="420" width="380" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="92" y="442" font-size="13" fill="#0f172a">▾  KBank</text>

    <text x="80" y="478" font-size="11" font-weight="600" fill="#64748b">Account number</text>
    <rect x="80" y="486" width="380" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="92" y="508" font-size="13" font-weight="600" fill="#0f172a" font-family="ui-monospace,monospace">XXX-X-XXXXX-X</text>

    <text x="80" y="544" font-size="11" font-weight="600" fill="#64748b">Account name</text>
    <rect x="80" y="552" width="380" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="92" y="574" font-size="13" font-weight="700" fill="#0f172a">นาย สมชาย ใจดี</text>
    <text x="466" y="574" text-anchor="end" font-size="10" fill="#92400e">⚠ ตรงกับสมุด</text>

    <text x="80" y="610" font-size="11" font-weight="600" fill="#64748b">Amount</text>
    <rect x="80" y="618" width="180" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="92" y="640" font-size="14" font-weight="800" fill="#0f172a" font-family="ui-monospace,monospace">฿  200.00</text>

    <text x="280" y="610" font-size="11" font-weight="600" fill="#64748b">Reference</text>
    <rect x="280" y="618" width="180" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="292" y="640" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-monospace,monospace">BES-SPA01-030526</text>

    <text x="80" y="676" font-size="11" font-weight="600" fill="#64748b">Description</text>
    <rect x="80" y="684" width="380" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="92" y="706" font-size="12" fill="#0f172a">BookEase pilot - Sabai Spa Thonglor</text>

    <!-- Submit button -->
    <rect x="80" y="740" width="380" height="40" rx="8" fill="#3b82f6"/>
    <text x="270" y="765" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Submit</text>
  </g>

  <!-- ═══ Arrow 1 → 2 ═══ -->
  <g transform="translate(490, 510)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="40,-6 52,0 40,6" fill="#94a3b8"/>
  </g>

  <!-- ═══ Step 2: Validate flow (3 tabs) ═══ -->
  <text x="560" y="200" font-size="12" font-weight="800" letter-spacing="2" fill="#3b82f6">STEP 2 + 3 OF 3</text>
  <text x="560" y="226" font-size="20" font-weight="700" fill="#0f172a">Validate → Approve · 2 clicks</text>

  <g filter="url(#cardShadow2)">
    <rect x="560" y="250" width="380" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Tabs -->
    <text x="580" y="290" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">DISBURSEMENT TABS</text>

    <!-- Tab 1: Needs Validation (active) -->
    <rect x="580" y="306" width="340" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="596" y="326" font-size="12" font-weight="700" fill="#92400e">Needs Validation</text>
    <text x="596" y="342" font-size="11" fill="#78350F">฿200 · BES-SPA01-030526 · KBank</text>
    <rect x="838" y="318" width="70" height="22" rx="11" fill="#f59e0b"/>
    <text x="873" y="333" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Validate</text>

    <!-- Arrow down -->
    <line x1="750" y1="358" x2="750" y2="376" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="744,376 750,388 756,376" fill="#94a3b8"/>

    <!-- Tab 2: Needs Approval -->
    <rect x="580" y="394" width="340" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="596" y="414" font-size="12" font-weight="700" fill="#1e40af">Needs Approval</text>
    <text x="596" y="430" font-size="11" fill="#1e3a8a">฿200 · BES-SPA01-030526 · KBank</text>
    <rect x="838" y="406" width="70" height="22" rx="11" fill="#3b82f6"/>
    <text x="873" y="421" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Approve</text>

    <!-- Arrow down -->
    <line x1="750" y1="446" x2="750" y2="464" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="744,464 750,476 756,464" fill="#94a3b8"/>

    <!-- Tab 3: Approved -->
    <rect x="580" y="482" width="340" height="40" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="596" y="500" font-size="12" font-weight="700" fill="#047857">✓ Approved</text>
    <text x="596" y="514" font-size="11" fill="#065f46">฿200 sent to KBank · 23:14:32</text>
  </g>

  <!-- Annotation under flow -->
  <g font-size="13">
    <text x="570" y="568" font-weight="700" fill="#0f172a">ผู้ใช้ Atiz Xendit account =</text>
    <text x="570" y="588" fill="#475569">View + Edit + Approve permission</text>
    <text x="570" y="608" fill="#475569">→ approve เองได้ทั้ง 3 ขั้น · ไม่ต้องคนอื่น</text>

    <text x="570" y="650" font-weight="700" fill="#dc2626">⚠ ห้ามผิด:</text>
    <text x="570" y="670" fill="#475569">• ชื่อบัญชีต้องตรงกับสมุด · ไม่ตรง = fail</text>
    <text x="570" y="690" fill="#475569">• Amount ต้องตรง (฿200 หรือ ฿190.20)</text>
    <text x="570" y="710" fill="#475569">• Reference unique ต่อ booking</text>

    <text x="570" y="752" font-weight="700" fill="#047857">⏱ Latency:</text>
    <text x="570" y="772" fill="#475569">KBank: ~10 วินาที (verified)</text>
    <text x="570" y="792" fill="#475569">อื่น ๆ (BBL, SCB, KTB, BAY): TBD</text>
  </g>

  <!-- ═══ Arrow 2 → 3 ═══ -->
  <g transform="translate(950, 510)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="40,-6 52,0 40,6" fill="#94a3b8"/>
  </g>

  <!-- ═══ Step 3: Spa SMS notification ═══ -->
  <text x="1010" y="200" font-size="12" font-weight="800" letter-spacing="2" fill="#047857">~10 SEC LATER</text>
  <text x="1010" y="226" font-size="20" font-weight="700" fill="#0f172a">Spa's phone ได้ SMS</text>

  <!-- iPhone frame -->
  <g filter="url(#phoneShadow2)">
    <rect x="1020" y="260" width="280" height="540" rx="36" fill="#0f172a"/>
    <rect x="1030" y="270" width="260" height="520" rx="26" fill="#ffffff"/>

    <!-- Status bar -->
    <text x="1050" y="294" font-size="12" font-weight="700" fill="#0f172a">9:41</text>
    <circle cx="1160" cy="290" r="5" fill="#0f172a"/>
    <rect x="1242" y="285" width="11" height="9" rx="2" fill="#0f172a"/>
    <rect x="1257" y="285" width="11" height="9" rx="2" fill="#0f172a"/>
    <rect x="1272" y="285" width="13" height="9" rx="2" fill="#0f172a"/>

    <!-- Lock screen header -->
    <text x="1160" y="338" text-anchor="middle" font-size="32" font-weight="200" fill="#0f172a">23:14</text>
    <text x="1160" y="364" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">วันอังคาร 3 พ.ค.</text>

    <!-- Bank SMS noti card -->
    <g filter="url(#cardShadow2)">
      <rect x="1050" y="394" width="220" height="118" rx="14" fill="#ffffff"/>

      <rect x="1050" y="394" width="220" height="32" rx="14" fill="#f0fdf4"/>
      <rect x="1050" y="416" width="220" height="10" fill="#f0fdf4"/>

      <circle cx="1066" cy="410" r="8" fill="#10b981"/>
      <text x="1066" y="415" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">✓</text>
      <text x="1080" y="414" font-size="12" font-weight="700" fill="#047857">KBANK</text>
      <text x="1260" y="414" text-anchor="end" font-size="10" fill="#94a3b8">ตอนนี้</text>

      <text x="1066" y="448" font-size="12" font-weight="700" fill="#0f172a">฿200.00 ฝาก</text>
      <text x="1066" y="468" font-size="11" fill="#475569">จาก: BOOKEASE</text>
      <text x="1066" y="486" font-size="11" fill="#475569">ยอดคงเหลือ: ฿XX,XXX.XX</text>
      <text x="1066" y="504" font-size="10" fill="#94a3b8" font-family="ui-monospace,monospace">REF: BES-SPA01</text>
    </g>

    <!-- Reaction emoji -->
    <text x="1160" y="586" text-anchor="middle" font-size="44">🎉</text>
    <text x="1160" y="618" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">"เงินเข้าจริง!"</text>
    <text x="1160" y="638" text-anchor="middle" font-size="12" fill="#64748b">— spa owner</text>
    <text x="1160" y="678" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#047857">TRUST EARNED</text>
  </g>

  <!-- Bottom verdict box -->
  <rect x="60" y="840" width="1280" height="50" rx="10" fill="#1e293b"/>
  <text x="700" y="872" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">
    <tspan fill="#fcd34d" font-weight="800">⭐ MONEY SHOT</tspan>  คือ moment ที่แตกต่างระหว่าง demo (vapor) และ life (real money) · ห้ามข้าม · ห้ามอธิบาย · ให้ระบบทำให้ดู
  </text>
</svg>
