<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Noto Sans Thai','Sukhumvit Set',-apple-system,'SF Pro',sans-serif">
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1400" height="600" fill="#fafaf7"/>

  <!-- ═══ Title ═══ -->
  <text x="60" y="60" font-size="14" font-weight="700" letter-spacing="3" fill="#64748b">CARAVAN FLOW · 30-45 MIN</text>
  <text x="60" y="100" font-size="32" font-weight="800" fill="#0f172a">11 ขั้นตอน · จากเดินเข้าร้าน → spa รับเงินจริง</text>
  <line x1="60" y1="130" x2="1340" y2="130" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ═══ Phase labels ═══ -->
  <text x="120" y="180" font-size="11" font-weight="800" letter-spacing="2" fill="#92400e">PRE-VISIT</text>
  <text x="320" y="180" font-size="11" font-weight="800" letter-spacing="2" fill="#9a3412">DOPAMINE MOMENT</text>
  <text x="660" y="180" font-size="11" font-weight="800" letter-spacing="2" fill="#1e40af">SETUP</text>
  <text x="980" y="180" font-size="11" font-weight="800" letter-spacing="2" fill="#10b981">MONEY SHOT</text>
  <text x="1230" y="180" font-size="11" font-weight="800" letter-spacing="2" fill="#7c3aed">CLOSE</text>

  <!-- ═══ Timeline backbone ═══ -->
  <line x1="100" y1="320" x2="1300" y2="320" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Phase backgrounds -->
  <rect x="80" y="200" width="180" height="200" rx="12" fill="#fef3c7" opacity="0.4"/>
  <rect x="280" y="200" width="320" height="200" rx="12" fill="#fed7aa" opacity="0.4"/>
  <rect x="620" y="200" width="320" height="200" rx="12" fill="#dbeafe" opacity="0.4"/>
  <rect x="960" y="200" width="220" height="200" rx="12" fill="#d1fae5" opacity="0.5"/>
  <rect x="1200" y="200" width="160" height="200" rx="12" fill="#ede9fe" opacity="0.4"/>

  <!-- ═══ Step circles + labels ═══ -->
  <g font-family="'Sarabun',sans-serif">
    <!-- Step 1 -->
    <circle cx="160" cy="320" r="22" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <text x="160" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">1</text>
    <text x="160" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">เตรียมก่อนเข้า</text>
    <text x="160" y="370" text-anchor="middle" font-size="11" fill="#64748b">5 นาที</text>
    <text x="160" y="385" text-anchor="middle" font-size="10" fill="#92400e">OCR pre-visit</text>

    <!-- Step 2 -->
    <circle cx="340" cy="320" r="22" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
    <text x="340" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">2</text>
    <text x="340" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ขอถ่ายเมนู</text>
    <text x="340" y="370" text-anchor="middle" font-size="11" fill="#64748b">60 วินาที</text>
    <text x="340" y="385" text-anchor="middle" font-size="10" fill="#9a3412">menu OCR</text>

    <!-- Step 3 -->
    <circle cx="450" cy="320" r="26" fill="#ea580c" stroke="#9a3412" stroke-width="3"/>
    <text x="450" y="328" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
    <text x="450" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#9a3412">โชว์เว็บร้าน ⭐</text>
    <text x="450" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">30 วินาที</text>
    <text x="450" y="391" text-anchor="middle" font-size="10" fill="#9a3412">"อันนี้ร้านผมเลย"</text>

    <!-- Step 4 -->
    <circle cx="560" cy="320" r="22" fill="#f97316" stroke="#9a3412" stroke-width="2"/>
    <text x="560" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">4</text>
    <text x="560" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Pitch + ค่าธรรมเนียม</text>
    <text x="560" y="370" text-anchor="middle" font-size="11" fill="#64748b">3 นาที</text>
    <text x="560" y="385" text-anchor="middle" font-size="10" fill="#9a3412">"เว็บไซต์ฟรี"</text>

    <!-- Step 5 -->
    <circle cx="680" cy="320" r="22" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <text x="680" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">5</text>
    <text x="680" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Sign up shopv3</text>
    <text x="680" y="370" text-anchor="middle" font-size="11" fill="#64748b">10 นาที</text>
    <text x="680" y="385" text-anchor="middle" font-size="10" fill="#1e40af">KYC + bank info</text>

    <!-- Step 6 -->
    <circle cx="800" cy="320" r="22" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <text x="800" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">6</text>
    <text x="800" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ปุ่มจอง LINE</text>
    <text x="800" y="370" text-anchor="middle" font-size="11" fill="#64748b">3 นาที</text>
    <text x="800" y="385" text-anchor="middle" font-size="10" fill="#1e40af">Rich Menu URL</text>

    <!-- Step 7 -->
    <circle cx="920" cy="320" r="22" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <text x="920" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">7</text>
    <text x="920" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ทดสอบ ฿200</text>
    <text x="920" y="370" text-anchor="middle" font-size="11" fill="#64748b">5 นาที</text>
    <text x="920" y="385" text-anchor="middle" font-size="10" fill="#1e40af">customer book</text>

    <!-- Step 8 -->
    <circle cx="1040" cy="320" r="26" fill="#10b981" stroke="#047857" stroke-width="3"/>
    <text x="1040" y="328" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">8</text>
    <text x="1040" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#047857">MONEY SHOT ⭐</text>
    <text x="1040" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">5 นาที</text>
    <text x="1040" y="391" text-anchor="middle" font-size="10" fill="#047857">disburse → SMS spa</text>

    <!-- Step 9 -->
    <circle cx="1140" cy="320" r="22" fill="#34d399" stroke="#047857" stroke-width="2"/>
    <text x="1140" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">9</text>
    <text x="1140" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ข้อตกลง + รูปร้าน</text>
    <text x="1140" y="370" text-anchor="middle" font-size="11" fill="#64748b">5 นาที</text>

    <!-- Step 10 -->
    <circle cx="1240" cy="320" r="22" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="1240" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">10</text>
    <text x="1240" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Refund test</text>
    <text x="1240" y="370" text-anchor="middle" font-size="11" fill="#64748b">1 นาที</text>

    <!-- Step 11 -->
    <circle cx="1320" cy="320" r="22" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="1320" y="327" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">11</text>
    <text x="1320" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Broadcast</text>
    <text x="1320" y="370" text-anchor="middle" font-size="11" fill="#64748b">3 นาที</text>
  </g>

  <!-- ═══ Bottom highlights ═══ -->
  <rect x="60" y="450" width="640" height="120" rx="12" fill="#fff" stroke="#e2e8f0" filter="url(#boxShadow)"/>
  <text x="80" y="478" font-size="12" font-weight="800" letter-spacing="2" fill="#9a3412">⭐ STEP 3 · DOPAMINE MOMENT</text>
  <text x="80" y="504" font-size="14" font-weight="700" fill="#0f172a">"ทำให้เจ้าของร้านพูดว่า 'อันนี้ร้านผมเลย' ภายใน 60 วินาที"</text>
  <text x="80" y="528" font-size="13" fill="#475569">ก่อนพูดคำว่า Atiz / BookEase / ค่าธรรมเนียม</text>
  <text x="80" y="548" font-size="13" fill="#475569">ถ้าผ่าน step 3 ได้ · ที่เหลือคือ paperwork</text>

  <rect x="720" y="450" width="620" height="120" rx="12" fill="#fff" stroke="#e2e8f0" filter="url(#boxShadow)"/>
  <text x="740" y="478" font-size="12" font-weight="800" letter-spacing="2" fill="#047857">⭐ STEP 8 · MONEY SHOT</text>
  <text x="740" y="504" font-size="14" font-weight="700" fill="#0f172a">Spa ได้ SMS "ฝาก THB X.XX จาก BOOKEASE"</text>
  <text x="740" y="528" font-size="13" fill="#475569">~10 วินาทีหลังกด Approve (KBank verified)</text>
  <text x="740" y="548" font-size="13" fill="#475569">→ TRUST EARNED · merchant เห็นเงินจริง · ไม่ใช่ vapor</text>
</svg>
