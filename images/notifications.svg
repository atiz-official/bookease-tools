<svg viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Noto Sans Thai','Sukhumvit Set',-apple-system,'SF Pro',sans-serif">
  <defs>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="lineGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06c755"/>
      <stop offset="100%" stop-color="#04a347"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="980" fill="#f1f5f9"/>

  <!-- ═══ Title ═══ -->
  <text x="60" y="60" font-size="14" font-weight="700" letter-spacing="3" fill="#64748b">NOTIFICATION ARCHITECTURE · v0 PILOT</text>
  <text x="60" y="100" font-size="34" font-weight="800" fill="#0f172a">LINE Push + SMS · ใช้ทั้งคู่</text>
  <text x="60" y="130" font-size="16" fill="#475569">เทียบ format ที่ merchant เห็น · เลือกใช้อะไรไม่ได้ · ระบบส่งทั้งคู่อัตโนมัติ</text>
  <line x1="60" y1="160" x2="1340" y2="160" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ═══ LEFT · LINE Push rich card ═══ -->
  <text x="80" y="210" font-size="13" font-weight="800" letter-spacing="2" fill="#06c755">LINE PUSH · RICH FLEX MESSAGE</text>
  <text x="80" y="238" font-size="22" font-weight="700" fill="#0f172a">@bookease ในแอป LINE</text>
  <text x="80" y="262" font-size="13" fill="#64748b">ฟรี · real-time · มีปุ่มกดได้ · เห็นใน LINE chat</text>

  <!-- iPhone frame -->
  <g filter="url(#phoneShadow)">
    <rect x="80" y="290" width="320" height="620" rx="40" fill="#0f172a"/>
    <rect x="92" y="302" width="296" height="596" rx="28" fill="#ffffff"/>

    <!-- Status bar -->
    <text x="120" y="328" font-size="13" font-weight="700" fill="#0f172a">9:41</text>
    <circle cx="240" cy="324" r="6" fill="#0f172a"/>
    <rect x="328" y="319" width="12" height="10" rx="2" fill="#0f172a"/>
    <rect x="344" y="319" width="12" height="10" rx="2" fill="#0f172a"/>
    <rect x="360" y="319" width="14" height="10" rx="2" fill="#0f172a"/>

    <!-- LINE chat header -->
    <rect x="92" y="338" width="296" height="48" fill="#fafafa"/>
    <circle cx="116" cy="362" r="14" fill="url(#lineGreen)"/>
    <text x="116" y="367" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">B</text>
    <text x="142" y="358" font-size="14" font-weight="700" fill="#0f172a">@bookease</text>
    <text x="142" y="376" font-size="11" fill="#64748b">Atiz · official</text>
    <text x="370" y="367" text-anchor="end" font-size="11" fill="#06c755" font-weight="600">●</text>

    <!-- Chat bg -->
    <rect x="92" y="386" width="296" height="490" fill="#e6e9ec"/>

    <!-- Time stamp -->
    <text x="240" y="416" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">วันนี้ 23:14</text>

