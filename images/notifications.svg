    <g filter="url(#cardShadow)">
      <rect x="106" y="430" width="268" height="370" rx="14" fill="#ffffff"/>

      <!-- Header -->
      <rect x="106" y="430" width="268" height="44" rx="14" fill="#ecfdf5"/>
      <rect x="106" y="460" width="268" height="14" fill="#ecfdf5"/>
      <text x="124" y="458" font-size="14" font-weight="800" fill="#06c755">🆕  จองใหม่</text>
      <text x="356" y="458" text-anchor="end" font-size="11" font-weight="600" fill="#94a3b8">23:14</text>

      <!-- Body -->
      <text x="124" y="500" font-size="18" font-weight="800" fill="#0f172a">พี่อ้อม</text>
      <text x="124" y="520" font-size="13" fill="#64748b">092-xxx-1234</text>

      <line x1="124" y1="538" x2="356" y2="538" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>

      <text x="124" y="562" font-size="12" fill="#94a3b8">บริการ</text>
      <text x="356" y="562" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">Manicure คลาสสิก</text>

      <text x="124" y="584" font-size="12" fill="#94a3b8">เวลา</text>
      <text x="356" y="584" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">พรุ่งนี้ 10:00 น.</text>

      <text x="124" y="606" font-size="12" fill="#94a3b8">ราคา</text>
      <text x="356" y="606" text-anchor="end" font-size="13" font-weight="800" fill="#0f172a">฿650</text>

      <line x1="124" y1="624" x2="356" y2="624" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>

      <text x="124" y="650" font-size="13" font-weight="700" fill="#06c755">✓  มัดจำ ฿200 รับแล้ว</text>

      <!-- Action buttons -->
      <line x1="106" y1="676" x2="374" y2="676" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="124" y="694" width="106" height="40" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="177" y="719" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">📞 ติดต่อ</text>
      <rect x="244" y="694" width="118" height="40" rx="20" fill="#06c755"/>
      <text x="303" y="719" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ดูทั้งหมด →</text>

      <text x="240" y="772" text-anchor="middle" font-size="11" fill="#94a3b8">เปิด shop.bookease.co/sabai/</text>
    </g>
  </g>

  <!-- LINE Push annotations -->
  <g font-size="13" fill="#0f172a">
    <text x="430" y="446" font-weight="700" fill="#06c755">✓ Rich card format</text>
    <text x="430" y="468" fill="#475569">หัวสีเขียว · time stamp · clearly "noti"</text>

    <text x="430" y="510" font-weight="700" fill="#06c755">✓ ข้อมูลครบ + อ่านง่าย</text>
    <text x="430" y="532" fill="#475569">ชื่อ · เบอร์ · บริการ · เวลา · ราคา · มัดจำ</text>
    <text x="430" y="552" fill="#475569">layout เป็น row · ตรง ๆ ไม่ต้องแกะ</text>

    <text x="430" y="594" font-weight="700" fill="#06c755">✓ ปุ่มกดได้</text>
    <text x="430" y="616" fill="#475569">"📞 ติดต่อ" → tel: ลูกค้าทันที</text>
    <text x="430" y="636" fill="#475569">"ดูทั้งหมด" → shop.bookease.co/sabai/</text>

    <text x="430" y="678" font-weight="700" fill="#06c755">✓ ฟรี</text>
    <text x="430" y="700" fill="#475569">LINE Messaging API · ไม่มีค่า/message</text>

    <text x="430" y="742" font-weight="700" fill="#dc2626">⚠ ขึ้นกับ:</text>
    <text x="430" y="764" fill="#475569">merchant add @bookease เป็นเพื่อน</text>
    <text x="430" y="784" fill="#475569">LINE app working · noti not muted</text>
  </g>

  <!-- ═══ DIVIDER ═══ -->
  <line x1="700" y1="200" x2="700" y2="900" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ═══ RIGHT · SMS plain text ═══ -->
  <text x="730" y="210" font-size="13" font-weight="800" letter-spacing="2" fill="#3b82f6">SMS · PLAIN TEXT (BEER)</text>
  <text x="730" y="238" font-size="22" font-weight="700" fill="#0f172a">SMS เข้าโทรศัพท์ปกติ</text>
  <text x="730" y="262" font-size="13" fill="#64748b">฿0.40/booking · 100% delivery · backup ที่เชื่อถือได้</text>

  <!-- iPhone frame · SMS -->
  <g filter="url(#phoneShadow)">
    <rect x="730" y="290" width="320" height="620" rx="40" fill="#0f172a"/>
    <rect x="742" y="302" width="296" height="596" rx="28" fill="#ffffff"/>

    <!-- Status bar -->
    <text x="770" y="328" font-size="13" font-weight="700" fill="#0f172a">9:41</text>
    <circle cx="890" cy="324" r="6" fill="#0f172a"/>
    <rect x="978" y="319" width="12" height="10" rx="2" fill="#0f172a"/>
    <rect x="994" y="319" width="12" height="10" rx="2" fill="#0f172a"/>
    <rect x="1010" y="319" width="14" height="10" rx="2" fill="#0f172a"/>

    <!-- SMS app header -->
    <rect x="742" y="338" width="296" height="48" fill="#fafafa"/>
    <text x="770" y="358" font-size="13" fill="#3b82f6">‹  ข้อความ</text>
    <text x="890" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Atiz</text>
    <text x="890" y="378" text-anchor="middle" font-size="10" fill="#94a3b8">SMS</text>

    <!-- Chat bg -->
    <rect x="742" y="386" width="296" height="490" fill="#ffffff"/>

    <!-- Time stamp -->
    <text x="890" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">วันนี้ 23:14</text>

    <!-- SMS bubble (gray, iMessage-style) -->
    <rect x="762" y="448" width="234" height="186" rx="20" fill="#e9e9eb"/>
    <text x="780" y="478" font-size="13" fill="#0f172a">จองใหม่ พี่อ้อม 0921234567</text>
    <text x="780" y="500" font-size="13" fill="#0f172a">Manicure 10:00 พรุ่งนี้ ฿650</text>
    <text x="780" y="522" font-size="13" fill="#0f172a">มัดจำ ฿200 รับแล้ว</text>
    <line x1="780" y1="540" x2="978" y2="540" stroke="#c7c7cc" stroke-width="1"/>
    <text x="780" y="566" font-size="12" font-weight="600" fill="#3b82f6">ดู: shop.bookease.co/s/abc123</text>
    <text x="780" y="606" font-size="11" fill="#64748b">~140 chars · 2 SMS segments</text>

    <text x="890" y="676" text-anchor="middle" font-size="11" fill="#94a3b8">เปิด shop.bookease.co/sabai/</text>
  </g>

  <!-- SMS annotations -->
  <g font-size="13" fill="#0f172a">
    <text x="1080" y="446" font-weight="700" fill="#3b82f6">✓ ทำงานเสมอ</text>
    <text x="1080" y="468" fill="#475569">SMS infrastructure carrier-grade</text>
    <text x="1080" y="488" fill="#475569">99.9% delivery · เร็วเสมอ</text>

    <text x="1080" y="530" font-weight="700" fill="#3b82f6">✓ ไม่ต้อง add OA</text>
    <text x="1080" y="552" fill="#475569">เลขโทรศัพท์ persistent</text>
    <text x="1080" y="572" fill="#475569">เปลี่ยนมือถือ · ยังได้ message</text>

    <text x="1080" y="614" font-weight="700" fill="#3b82f6">✓ Universal trust</text>
    <text x="1080" y="636" fill="#475569">SMS = formal · official feel</text>
    <text x="1080" y="656" fill="#475569">50-yr merchant familiar</text>

    <text x="1080" y="698" font-weight="700" fill="#dc2626">⚠ Limitations:</text>
    <text x="1080" y="720" fill="#475569">text-only · 70 char Thai · ไม่มีปุ่ม</text>
    <text x="1080" y="740" fill="#475569">฿0.40/booking · scale cost</text>
    <text x="1080" y="760" fill="#475569">ไม่ real-time formatting</text>

    <text x="1080" y="800" font-weight="700" fill="#7c3aed">💰 ค่าใช้จ่าย:</text>
    <text x="1080" y="822" fill="#475569">฿120/spa/month (10 booking/day)</text>
    <text x="1080" y="842" fill="#475569">12% ของ revenue spa pilot</text>
  </g>

  <!-- ═══ Bottom verdict ═══ -->
  <rect x="60" y="930" width="1280" height="40" rx="10" fill="#1e293b"/>
  <text x="700" y="956" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">
    <tspan fill="#fcd34d" font-weight="800">VERDICT:</tspan>  ใช้ทั้งคู่ใน v0 pilot · ระบบส่งอัตโนมัติทั้ง 2 ช่อง · post-pilot data จะบอกว่าใช้แค่ตัวไหน
  </text>
</svg>
