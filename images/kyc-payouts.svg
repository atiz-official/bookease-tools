    <text x="64" y="142" font-size="13" font-weight="700" fill="#475569">เริ่มกรอกข้อมูล</text>
    <text x="64" y="158" font-size="11" fill="#64748b">กรอก 6 ช่อง + อัปโหลดเอกสาร 2 รูป</text>

    <!-- Section: ข้อมูลบัญชี -->
    <text x="22" y="200" font-size="13" font-weight="800" fill="#0f172a">ข้อมูลบัญชีธนาคาร</text>

    <text x="22" y="226" font-size="11" font-weight="600" fill="#334155">ธนาคาร *</text>
    <rect x="22" y="234" width="336" height="38" rx="10" fill="#fafafa" stroke="#cbd5e1"/>
    <text x="34" y="258" font-size="13" fill="#94a3b8">▾  เลือกธนาคาร</text>

    <text x="22" y="290" font-size="11" font-weight="600" fill="#334155">เลขบัญชี *</text>
    <rect x="22" y="298" width="336" height="38" rx="10" fill="#fafafa" stroke="#cbd5e1"/>
    <text x="34" y="322" font-size="13" fill="#94a3b8">เช่น 1234567890</text>

    <text x="22" y="354" font-size="11" font-weight="600" fill="#334155">ชื่อบัญชี *</text>
    <rect x="22" y="362" width="336" height="38" rx="10" fill="#fafafa" stroke="#cbd5e1"/>
