    <rect x="22" y="754" width="336" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="34" y="766" width="14" height="14" rx="3" fill="#fff" stroke="#5777ef" stroke-width="1.5"/>
    <text x="58" y="772" font-size="11" fill="#1e293b">ข้าพเจ้ายืนยันว่าเป็นเจ้าของบัญชีนี้จริง</text>
    <text x="58" y="788" font-size="11" fill="#1e293b">และข้อมูลที่กรอกถูกต้องครบถ้วน</text>

    <!-- Submit · disabled -->
    <rect x="22" y="816" width="336" height="44" rx="22" fill="#cbd5e1"/>
    <text x="190" y="844" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">บันทึกข้อมูล</text>
