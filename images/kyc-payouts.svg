    <text x="22" y="418" font-size="11" font-weight="600" fill="#334155">เลขผู้เสียภาษี (ไม่บังคับ)</text>
    <rect x="22" y="426" width="336" height="38" rx="10" fill="#fafafa" stroke="#cbd5e1"/>
    <text x="34" y="450" font-size="13" fill="#94a3b8">0-1234-56789-01-2</text>

    <line x1="22" y1="486" x2="358" y2="486" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Section: เอกสารยืนยัน -->
    <text x="22" y="514" font-size="13" font-weight="800" fill="#0f172a">เอกสารยืนยัน</text>

    <text x="22" y="540" font-size="11" font-weight="600" fill="#334155">📷 รูปสมุดบัญชี (หน้าแรก) *</text>
