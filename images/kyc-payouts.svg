    <text x="22" y="632" font-size="11" fill="#64748b">จะถูกใช้เพื่อโอนเงินมัดจำเข้าบัญชีพี่</text>

    <text x="22" y="664" font-size="11" font-weight="600" fill="#334155">ติดต่อปัญหา:</text>
