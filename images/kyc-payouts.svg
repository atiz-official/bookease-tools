    <text x="34" y="266" font-size="13" font-weight="600" fill="#0f172a">KBANK</text>

    <rect x="22" y="280" width="336" height="38" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="34" y="295" font-size="10" fill="#94a3b8">เลขบัญชี</text>
    <text x="34" y="312" font-size="13" font-weight="600" fill="#0f172a" font-family="ui-monospace,monospace">XXX-X-XXXXX-1234</text>

    <rect x="22" y="326" width="336" height="38" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="34" y="341" font-size="10" fill="#94a3b8">ชื่อบัญชี</text>
    <text x="34" y="358" font-size="13" font-weight="600" fill="#0f172a">นาย สมชาย ใจดี</text>

    <!-- Eligible badge -->
