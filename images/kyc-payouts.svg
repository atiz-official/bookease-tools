    <text x="190" y="574" text-anchor="middle" font-size="22" fill="#94a3b8">⬆</text>
    <text x="190" y="596" text-anchor="middle" font-size="11" fill="#94a3b8">JPG / PNG / PDF · ≤10 MB</text>

    <text x="22" y="630" font-size="11" font-weight="600" fill="#334155">📷 รูปบัตรประชาชน (หน้าบัตร) *</text>
    <rect x="22" y="638" width="336" height="60" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="190" y="664" text-anchor="middle" font-size="22" fill="#94a3b8">⬆</text>
    <text x="190" y="686" text-anchor="middle" font-size="11" fill="#94a3b8">JPG / PNG / PDF · ≤10 MB</text>

    <line x1="22" y1="722" x2="358" y2="722" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>

