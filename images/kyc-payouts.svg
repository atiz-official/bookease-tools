    <text x="102" y="478" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">สมุดบัญชี ✓</text>

    <rect x="198" y="416" width="160" height="80" rx="10" fill="#f0fdf4" stroke="#10b981"/>
    <text x="278" y="450" text-anchor="middle" font-size="20" fill="#10b981">🪪</text>
    <text x="278" y="478" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">บัตรประชาชน ✓</text>

