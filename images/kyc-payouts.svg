<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Noto Sans Thai','Sukhumvit Set',-apple-system,'SF Pro',sans-serif">
  <defs>
    <filter id="phoneShadowK" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadowK" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1400" height="1100" fill="#f1f5f9"/>

  <!-- Title -->
  <text x="60" y="60" font-size="14" font-weight="800" letter-spacing="3" fill="#5777ef">/payouts · KYC + BANK INFO</text>
  <text x="60" y="100" font-size="32" font-weight="800" fill="#0f172a">หน้าใส่ข้อมูลธนาคาร · merchant flow (Pass 17)</text>
  <text x="60" y="130" font-size="15" fill="#475569">มือถือ-first · 6 fields required · status banner · soft consent (Pass 22)</text>
  <line x1="60" y1="160" x2="1340" y2="160" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════
       LEFT · Empty state (first-time merchant)
       ═══════════════════════════════════════════════ -->
  <text x="80" y="210" font-size="12" font-weight="800" letter-spacing="2" fill="#94a3b8">STATE 1 · เริ่มกรอกข้อมูล</text>

  <g filter="url(#phoneShadowK)" transform="translate(80, 240)">
    <rect width="380" height="800" rx="36" fill="#0f172a"/>
    <rect x="10" y="10" width="360" height="780" rx="28" fill="#ffffff"/>

    <!-- Status bar -->
    <text x="34" y="38" font-size="12" font-weight="700" fill="#0f172a">9:41</text>
    <text x="346" y="38" text-anchor="end" font-size="12" font-weight="700" fill="#0f172a">▰▰▰▰▰</text>

    <!-- Header -->
    <line x1="10" y1="56" x2="370" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="84" font-size="13" fill="#5777ef">‹  ย้อนกลับ</text>
    <text x="190" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ข้อมูลบัญชีธนาคาร</text>
    <line x1="10" y1="104" x2="370" y2="104" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Status banner · empty state -->
    <rect x="22" y="120" width="336" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <circle cx="44" cy="144" r="9" fill="#94a3b8"/>
