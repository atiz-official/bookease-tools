<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>เว็บร้านของคุณ · BookEase</title>
<meta name="description" content="พรีวิวเว็บร้าน · แก้บริการ · เลือกลุค · บันทึกร้านนี้">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── ONE locked type scale + payouts.tsx colour hierarchy (shipped) ──
     §6c binding mandate · FINAL onboarding mock P2 (Art-locked 2026-05-16):
     section heading = #134783 blue · values #0a0a0a · links #5777EF ·
     meta slate · ONE scale (no เดี๋ยวใหญ่เดี๋ยวเล็ก). Brain (decode /
     save→shopv3 prefill / copy / share) preserved EXACTLY from the
     shipped chain — only the layout becomes the agreed mock panel. */
  :root{
    --ink:#0a0a0a; --head:#134783; --accent:#5777EF; --line:#ececec;
    --cream:#faf7f2; --muted:#6b7280; --faint:#9ca3af; --ok:#10b981;
    --line-green:#06C755;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Sarabun','Inter',system-ui,sans-serif;background:#fff;
    color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;
  }
  .wrap{max-width:480px;margin:0 auto;padding:10px 20px calc(126px + env(safe-area-inset-bottom));}

  /* §6c · customer preview · FULL-BLEED 3-page swipe hero · very top
     (no topbar · no wordy hint · dots self-explain) */
  .pvpager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    width:100%;max-width:480px;margin:0 auto;scrollbar-width:none}
  .pvpager::-webkit-scrollbar{display:none}
  .pvpage{flex:0 0 100%;scroll-snap-align:center;height:clamp(208px,46vw,280px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;text-align:center;
    background:linear-gradient(165deg,#f7eee4,#efdccd 52%,#e6cab4);color:#5a4636}
  .pvpage .pv-url{position:absolute;top:11px;left:11px;background:rgba(255,255,255,.82);
    font-size:12px;font-weight:600;color:#7a6a58;padding:4px 10px;border-radius:999px}
  .pvpage .pv-tag{position:absolute;top:11px;right:11px;background:rgba(255,255,255,.82);
    font-size:9px;font-weight:700;color:#9c8161;padding:3px 9px;border-radius:999px;letter-spacing:.06em}
  .pvpage .pv-ttl{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    font-size:9px;font-weight:700;color:#9c8161;letter-spacing:.08em}
  .pv-brand{font-family:'Inter',sans-serif;font-weight:300;letter-spacing:.3em;font-size:25px}
  .pv-dv{width:30px;height:1px;background:currentColor;opacity:.45;margin:12px 0 9px}
  .pv-est{font-size:10px;letter-spacing:.3em;font-weight:600;opacity:.7}
  .pv-svcname{font-size:20px;font-weight:700;margin-bottom:5px}
  .pv-svcpr{font-size:13px;opacity:.78;font-weight:600;margin-bottom:10px}
  .pv-btn{background:#5a4636;color:#f7eee4;font-size:12px;font-weight:700;padding:9px 20px;border-radius:999px}
  .pv-chips{display:flex;gap:6px;margin-bottom:16px}
  .pv-chip{border:1px solid currentColor;font-size:10px;font-weight:700;padding:5px 10px;border-radius:9px;opacity:.65}
  .pv-chip.on{background:#5a4636;color:#f7eee4;border-color:#5a4636;opacity:1}
  .pvdots{display:flex;gap:6px;justify-content:center;margin:7px 0 0}
  .pvdots i{width:6px;height:6px;border-radius:50%;background:#d8d2c7;transition:all .2s}
  .pvdots i.on{background:var(--head);width:18px;border-radius:99px}

  /* page 3 · the USUAL square slot picker (mirrors ServiceDetailPage
     SlotPickerSection · NOT the advanced wheel) */
  .pv-tpage{justify-content:center;align-items:stretch;text-align:left;padding:30px 16px 16px}
  .pv-slotbanner{display:flex;align-items:center;gap:7px;background:#f0fdf4;
    color:#16a34a;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;margin-bottom:12px}
  .pv-slotlabel{font-size:12px;font-weight:600;color:#737373;margin-bottom:8px}
  .pv-slotrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .pv-slot{display:flex;flex-direction:column;align-items:center;padding:11px 14px;
    border-radius:8px;border:1.5px solid #e5e5e5;background:#fff;font-size:16px;
    font-weight:700;color:#0a0a0a;line-height:1.15;min-width:64px;font-family:inherit;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 6px rgba(0,0,0,.05)}
  .pv-slot span{font-size:11px;font-weight:400;color:#a1a1a1;margin-top:3px}
  .pv-slot--on{background:#0a0a0a;border-color:#0a0a0a;color:#fff}
  .pv-slot--on span{color:rgba(255,255,255,.65)}
  .pv-slotmore{font-size:13px;font-weight:600;color:var(--accent)}

  /* ตรวจพบ category chip + เปลี่ยน */
  .cat{display:inline-flex;align-items:center;gap:8px;background:#ecfdf5;
    border:1px solid #a7f3d0;border-radius:999px;padding:6px 13px;
    font-size:13px;font-weight:700;color:#065f46;margin-bottom:10px}
  .cat .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .cat .lbl{color:#059669;font-weight:600}
  .cat .chg{color:#059669;text-decoration:underline;font-weight:700;
    background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px;padding:0}

  /* section heading · payouts blue */
  .h{font-size:17px;font-weight:700;color:var(--head);margin:22px 0 9px}
  .h:first-of-type{margin-top:0}

  /* variant pills */
  .vrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
  .vrow::-webkit-scrollbar{display:none}
  .vp{flex:0 0 auto;font-size:14px;font-weight:600;color:var(--faint);
    padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);
    cursor:pointer;font-family:inherit;transition:all .15s}
  .vp.on{color:var(--ink);background:#f1efe9;border-color:#dcd7cd;font-weight:800}
  .vp[data-v="surprise"]{color:#b45309}
  .vp[data-v="surprise"].on{background:#fffbeb;border-color:#fcd34d;color:#b45309}

  /* editable services */
  .svc{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .svc:first-of-type{border-top:none}
  .svc .nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);
    border:none;background:transparent;font-family:inherit;padding:2px 0;outline:none}
  .svc .nm:focus{border-bottom:1.5px solid var(--accent)}
  .svc .du{width:34px;text-align:right;font-size:14px;color:var(--muted);
    border:none;background:transparent;font-family:inherit;outline:none}
  .svc .du:focus{color:var(--ink)}
  .svc .duu{font-size:14px;color:var(--muted);margin-left:-4px}
  /* ฿ glued to the PRICE ("฿500" one unit) · NOT next to นาที.
     pr is left-aligned auto-width so the number sits right after ฿
     (was 84px right-aligned → huge dead gap between ฿ and the number) */
  .svc .prc{font-size:15px;font-weight:800;color:var(--ink);margin-left:auto;margin-right:-7px;flex:0 0 auto}
  .svc .pr{width:auto;min-width:42px;max-width:84px;text-align:left;font-size:15px;font-weight:800;color:var(--ink);
    border:none;background:transparent;font-family:inherit;outline:none;font-variant-numeric:tabular-nums}
  .svc .pr:focus{border-bottom:1.5px solid var(--accent)}
  /* shared pencil-edit affordance · used in service rows AND open-hours
     (Art: one consistent ✎ icon · no "แตะแก้" text) */
  .pen{color:#cbd5e1;font-size:14px;flex:0 0 auto}
  .svc .del{color:#cbd5e1;background:none;border:none;cursor:pointer;font-size:15px;
    flex:0 0 auto;padding:2px 4px}
  .svc .del:hover{color:#ef4444}
  .addrow{color:var(--accent);font-weight:700;font-size:15px;background:none;border:none;
    cursor:pointer;font-family:inherit;padding:8px 0 2px;display:block}
  .opent{font-size:13px;color:var(--muted);margin:16px 0 0}
  /* native time picker · recycled from shopv3 InputBox RegisterTimeInput
     (bg-slate-50 · border-slate-300 · rounded-lg) — easier than free text */
  .tin{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;
    padding:7px 9px;font-family:inherit;font-size:14px;color:#0a0a0a;outline:none}
  .tin:focus{border-color:#1E40AF;box-shadow:0 0 0 2px rgba(30,64,175,.12)}
  /* settable open-days · 7 toggle chips (Art: there was NO control —
     just dead text · "how do they set weekdays-only?") */
  /* recycled VERBATIM from shopv3 register_service.tsx day-picker so
     the preview matches the real signup the merchant lands on */
  .dayhdr{font-size:13px;color:#737373;margin:14px 0 0}
  .dayrow{display:flex;gap:6px;margin:8px 0 2px}
  .dc{flex:1;min-width:0;height:44px;border:2px solid #e5e5e5;border-radius:8px;
    background:#fff;font-family:inherit;font-size:13px;font-weight:700;color:#a1a1a1;cursor:pointer}
  .dc.on{background:#0a0a0a;color:#fff;border-color:#0a0a0a;
    box-shadow:0 2px 8px rgba(0,0,0,0.10)}
  .dc:active{transform:scale(.96)}
  #daySum{color:var(--ink);font-weight:700}

  /* deposit segmented */
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:13px;overflow:hidden;margin-top:4px}
  .seg button{flex:1;text-align:center;padding:12px 4px;font-size:14px;font-weight:700;
    color:var(--muted);border:none;border-right:1px solid var(--line);background:#fff;
    cursor:pointer;font-family:inherit}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:#fff}
  .seg .s{display:block;font-size:11px;font-weight:600;opacity:.72;margin-top:2px}
  .seg button.on .s{opacity:.85}
  .dephint{margin:8px 0 2px;font-size:14px;color:#374151}
  .dephint b{color:var(--ink)}

  /* viral bar (preserved verbs · §6c lock · GTM) */
  .viral{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    z-index:50}
  .viral-in{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:stretch}
  .save{flex:1;background:var(--line-green);color:#fff;border:none;border-radius:999px;
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;
    font-weight:800;font-family:inherit;cursor:pointer;min-height:52px;
    box-shadow:0 5px 16px rgba(6,199,85,.28)}
  .save:active{transform:scale(.98)}
  /* Apple pattern: solid systemFill chip (not a frail hairline) + a
     tiny label so copy/share are self-explanatory · the caption then
     only carries the non-obvious viral hook */
  .ico{width:60px;flex:0 0 60px;border:none;border-radius:15px;
    background:#eef0f3;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;color:#334155;cursor:pointer;font-family:inherit}
  .ico .g{font-size:18px;line-height:1}
  .ico .ico-l{font-size:10px;font-weight:700;color:#475569}
  .ico:active{transform:scale(.96)}
  .ico.copied{background:var(--ok);color:#fff}
  .ico.copied .ico-l{color:rgba(255,255,255,.82)}
  .vbar-cap{max-width:480px;margin:9px auto 0;text-align:center;font-size:12.5px;
    color:#6b7280;line-height:1.45}

  @media (max-width:380px){
    .wrap{padding:14px 14px calc(132px + env(safe-area-inset-bottom))}
    .vp{padding:8px 13px;font-size:13px}
  }
</style>
</head>
<body>
  <!-- §6c · customer preview · FULL-BLEED hero at the very top.
       No BookEase topbar (Art: not necessary on P2). No wordy hint —
       the dots self-explain the swipe. -->
  <div class="pvpager" id="pvp">
    <div class="pvpage" id="pvCover">
      <div class="pv-url">🔒 bookease.co/<span id="pvSlug">shop</span></div>
      <div class="pv-tag" id="pvTag">โปร่ง</div>
      <div class="pv-ttl">เพจร้าน</div>
      <div class="pv-brand" id="pvBrand">SHOP</div>
      <div class="pv-dv"></div>
      <div class="pv-est">EST. 2026</div>
    </div>
    <div class="pvpage">
      <div class="pv-ttl">เพจบริการ</div>
      <div class="pv-svcname" id="pvSvcName">บริการของร้าน</div>
      <div class="pv-svcpr" id="pvSvcPr">฿—</div>
      <div class="pv-btn">จองคิว →</div>
    </div>
    <!-- Art 2026-05-17: UI preview of the customer flow — page 3 = the
         USUAL square slot picker (mirrors ServiceDetailPage
         SlotPickerSection: 🟢 มีว่าง banner · เลือกด่วน · square white
         time chips [time + day · selected=black] · เลือกวันอื่น →) —
         NOT the advanced wheel. -->
    <div class="pvpage pv-tpage">
      <div class="pv-ttl">เพจเลือกเวลา</div>
      <div class="pv-slotbanner">🟢 มีว่าง</div>
      <div class="pv-slotlabel">เลือกด่วน</div>
      <div class="pv-slotrow">
        <button class="pv-slot pv-slot--on" type="button">14:00<span>วันนี้</span></button>
        <button class="pv-slot" type="button">16:30<span>วันนี้</span></button>
        <button class="pv-slot" type="button">18:00<span>วันนี้</span></button>
        <button class="pv-slot" type="button">10:30<span>พรุ่งนี้</span></button>
      </div>
      <div class="pv-slotmore">เลือกวันอื่น →</div>
    </div>
  </div>
  <div class="pvdots" id="pvd"><i class="on"></i><i></i><i></i></div>

  <div class="wrap">

    <div class="cat">
      <span class="d"></span>
      <span class="lbl">ประเภทร้าน:</span>
      <span id="catName">ความงาม</span>
      <button class="chg" id="catChange" type="button">เปลี่ยน</button>
    </div>

    <div class="h">ธีมเพจร้าน</div>
    <div class="vrow" id="variantRow">
      <button class="vp" data-v="airy"     type="button">โปร่ง</button>
      <button class="vp" data-v="luxury"   type="button">หรูหรา</button>
      <button class="vp" data-v="fun"      type="button">สนุก</button>
      <button class="vp" data-v="fresh"    type="button">สดชื่น</button>
      <button class="vp" data-v="surprise" type="button">เซอร์ไพรส์</button>
    </div>

    <div class="h">บริการร้าน</div>
    <div id="svcList"></div>
    <button class="addrow" id="addSvc" type="button">+ เพิ่มบริการ</button>
    <div class="opent">เปิด <input type="time" id="openS" value="10:00" class="tin" /> – <input type="time" id="openE" value="21:00" class="tin" /></div>
    <div class="dayhdr">วันที่เปิด · <span id="daySum">เปิดทุกวัน</span></div>
    <div class="dayrow" id="dayRow">
      <button class="dc on" type="button" data-d="1">จ</button>
      <button class="dc on" type="button" data-d="2">อ</button>
      <button class="dc on" type="button" data-d="3">พ</button>
      <button class="dc on" type="button" data-d="4">พฤ</button>
      <button class="dc on" type="button" data-d="5">ศ</button>
      <button class="dc on" type="button" data-d="6">ส</button>
      <button class="dc on" type="button" data-d="7">อา</button>
    </div>

    <div class="h">ลูกค้าจ่าย</div>
    <div class="seg" id="depSeg">
      <button data-d="fixed_200" type="button">มัดจำ ฿200<span class="s">เก็บคงที่</span></button>
      <button data-d="percent"   type="button">มัดจำ %<span class="s">ตามราคา</span></button>
      <button data-d="full"      type="button">จ่ายเต็ม<span class="s">เต็มจำนวน ✓</span></button>
    </div>
    <div class="dephint">เงินเข้าร้าน<b>ครบ</b> · กัน no-show 100%</div>
  </div>

  <div class="viral">
    <div class="viral-in">
      <button class="save" id="saveBtn" type="button">✓ บันทึกร้านนี้</button>
      <button class="ico" id="copyBtn" type="button" aria-label="คัดลอกลิงก์"><span class="g">⧉</span><span class="ico-l">คัดลอก</span></button>
      <button class="ico" id="shareBtn" type="button" aria-label="แชร์"><span class="g">↗</span><span class="ico-l">แชร์</span></button>
    </div>
    <div class="vbar-cap">ส่งให้เพื่อน → เขาเซฟเป็นร้านตัวเองได้</div>
  </div>

<script>
  // ════════════════════════════════════════════════════════════════
  // BRAIN — preserved EXACTLY from the shipped chain (§6c lock):
  // decode ?data → save → shopv3.bookease.co/signup?prefill= → copy/share
  // ════════════════════════════════════════════════════════════════
  var params = new URLSearchParams(location.search);

  function decodeData(b64){
    try { return JSON.parse(decodeURIComponent(escape(atob(b64)))); }
    catch(e){ return null; }
  }

  var shopData = (function(){
    var d = params.get('data') ? decodeData(params.get('data')) : null;
    if (d) return d;
    return {
      shopName:'Bare Nail Spa', shortName:'barenailspa',
      openTime:'10:00-21:00', variant:'airy',
      categoryName:'ความงาม',
      services:[
        { serviceName:'Manicure คลาสสิก', durationMin:60, price:500 },
        { serviceName:'Gel Polish', durationMin:75, price:800 },
      ],
    };
  })();

  // services normalised to {serviceName,durationMin,price} (the chain shape
  // register_index already decodes). Edits write back here → into the blob.
  var services = Array.isArray(shopData.services) ? shopData.services.map(function(s){
    return {
      serviceName: s.serviceName || s.name || '',
      durationMin: (typeof s.durationMin==='number') ? s.durationMin
                 : (typeof s.durationMinutes==='number') ? s.durationMinutes : null,
      price: (typeof s.price==='number') ? s.price : null,
    };
  }) : [];
  if (services.length === 0) services.push({ serviceName:'', durationMin:null, price:null });

  var currentVariant = ['airy','luxury','fun','fresh','surprise']
    .indexOf(shopData.variant) > -1 ? shopData.variant : 'airy';

  // deposit · default จ่ายเต็ม (full) — §6c · FINAL mock · Art lock 2026-05-16
  var depositType = ['fixed_200','percent','full'].indexOf(shopData.depositType) > -1
    ? shopData.depositType : 'full';
  var depositValue = typeof shopData.depositValue === 'number'
    ? shopData.depositValue
    : (depositType === 'fixed_200' ? 200 : depositType === 'percent' ? 50 : 0);

  // category · light detect mirroring the signup macro vocabulary
  var CATS = ['นวด & สปา','ความงาม','คลินิก','ฟิตเนส','อื่นๆ'];
  function detectCat(name){
    var n = (name||'').toLowerCase();
    if (/นวด|massage|สปา|spa|wellness/.test(n)) return 'นวด & สปา';
    if (/เล็บ|nail|ผม|hair|salon|beauty|ความงาม|คิ้ว|ขนตา|brow|lash/.test(n)) return 'ความงาม';
    if (/คลินิก|clinic|หมอ|skin|derma|aesthetic/.test(n)) return 'คลินิก';
    if (/ฟิต|fitness|gym|yoga|มวย|โยคะ/.test(n)) return 'ฟิตเนส';
    return 'ความงาม';
  }
  var catName = shopData.categoryName && CATS.indexOf(shopData.categoryName) > -1
    ? shopData.categoryName : detectCat(shopData.shopName);

  // ── render ──
  function renderCat(){ document.getElementById('catName').textContent = catName; }
  document.getElementById('catChange').addEventListener('click', function(){
    catName = CATS[(CATS.indexOf(catName) + 1) % CATS.length];
    renderCat();
  });

  // §6c · customer preview · variant labels + per-variant cover tint
  var VLABEL={airy:'โปร่ง',luxury:'หรูหรา',fun:'สนุก',fresh:'สดชื่น',surprise:'เซอร์ไพรส์'};
  var VBG={
    airy:'linear-gradient(165deg,#f4f7fb,#e8eef6 60%,#dde6f2)',
    luxury:'linear-gradient(165deg,#f7eee4,#efdccd 52%,#e6cab4)',
    fun:'linear-gradient(165deg,#fff4e6,#ffe2c2 55%,#ffd2a8)',
    fresh:'linear-gradient(165deg,#eefaf2,#d9f0e3 55%,#c4e8d3)',
    surprise:'linear-gradient(165deg,#241f33,#2f2747 60%,#3c3160)'
  };
  function renderPreview(){
    var slug=document.getElementById('pvSlug'); if(!slug)return;
    slug.textContent = shopData.shortName || 'shop';
    document.getElementById('pvBrand').textContent = (shopData.shopName||'SHOP').toUpperCase();
    document.getElementById('pvTag').textContent = VLABEL[currentVariant] || 'โปร่ง';
    // Art: ALL 3 pager pages carry the picked variant (the shop's page
    // IS variant-skinned · the white slot chips on page 3 keep their
    // real ServiceDetailPage look, floating on the variant bg).
    var bg = VBG[currentVariant] || VBG.luxury;
    var fg = (currentVariant === 'surprise') ? '#f1ecff' : '#5a4636';
    document.querySelectorAll('.pvpage').forEach(function(pg){
      pg.style.background = bg; pg.style.color = fg;
    });
    var s=(services.filter(function(x){return (x.serviceName||'').trim();})[0])||services[0];
    document.getElementById('pvSvcName').textContent =
      (s && s.serviceName) ? s.serviceName : 'บริการของร้าน';
    var pr=(s && s.price!=null) ? '฿'+Number(s.price).toLocaleString() : '฿—';
    var du=(s && s.durationMin!=null) ? ' · '+s.durationMin+' นาที' : '';
    document.getElementById('pvSvcPr').textContent = pr+du;
  }
  // dots sync to horizontal swipe
  (function(){
    var p=document.getElementById('pvp'),d=document.getElementById('pvd');
    if(!p||!d)return;
    var dots=d.querySelectorAll('i');
    p.addEventListener('scroll',function(){
      var i=Math.round(p.scrollLeft/p.clientWidth);
      dots.forEach(function(x,n){x.classList.toggle('on',n===i);});
    },{passive:true});
  })();

  function renderVariant(){
    document.querySelectorAll('.vp').forEach(function(b){
      b.classList.toggle('on', b.dataset.v === currentVariant);
    });
    renderPreview();
  }
  document.getElementById('variantRow').addEventListener('click', function(e){
    var b = e.target.closest('.vp'); if (!b) return;
    currentVariant = b.dataset.v; renderVariant();
  });

  function renderSvc(){
    var box = document.getElementById('svcList');
    box.innerHTML = '';
    services.forEach(function(s, i){
      var row = document.createElement('div');
      row.className = 'svc';
      row.innerHTML =
        '<input class="nm" placeholder="ชื่อบริการ" />' +
        '<input class="du" inputmode="numeric" placeholder="–" />' +
        '<span class="duu">นาที</span>' +
        '<span class="prc">฿</span>' +
        '<input class="pr" inputmode="numeric" placeholder="–" />' +
        '<span class="pen">✎</span>' +
        '<button class="del" type="button" aria-label="ลบ">×</button>';
      var nm = row.querySelector('.nm'), du = row.querySelector('.du'),
          pr = row.querySelector('.pr');
      nm.value = s.serviceName || '';
      du.value = (s.durationMin != null) ? s.durationMin : '';
      pr.value = (s.price != null) ? s.price : '';
      nm.addEventListener('input', function(){ services[i].serviceName = nm.value; });
      du.addEventListener('input', function(){
        du.value = du.value.replace(/\D/g,''); services[i].durationMin = du.value ? +du.value : null;
      });
      pr.addEventListener('input', function(){
        pr.value = pr.value.replace(/\D/g,''); services[i].price = pr.value ? +pr.value : null;
      });
      row.querySelector('.del').addEventListener('click', function(){
        services.splice(i,1);
        if (services.length === 0) services.push({serviceName:'',durationMin:null,price:null});
        renderSvc();
      });
      box.appendChild(row);
    });
    renderPreview();
  }
  document.getElementById('addSvc').addEventListener('click', function(){
    services.push({ serviceName:'', durationMin:null, price:null });
    renderSvc();
  });

  function renderDep(){
    document.querySelectorAll('#depSeg button').forEach(function(b){
      b.classList.toggle('on', b.dataset.d === depositType);
    });
  }
  document.getElementById('depSeg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    depositType = b.dataset.d;
    depositValue = depositType === 'fixed_200' ? 200 : depositType === 'percent' ? 50 : 0;
    renderDep();
  });

  // ── settable open-days · 7 toggle chips (Art: there was NO control) ──
  function daysOn(){
    return [].slice.call(document.querySelectorAll('#dayRow .dc.on'))
      .map(function(b){ return +b.dataset.d; });
  }
  // daysHint text recycled VERBATIM from shopv3 register_service.tsx
  function renderDays(){
    var n = daysOn().length, s;
    if (n === 7) s = 'เปิดทุกวัน';
    else if (n === 0) s = '⚠️ ปิดทุกวัน · กรุณาเลือกอย่างน้อย 1 วัน';
    else s = 'เปิด ' + n + ' วัน/สัปดาห์';
    document.getElementById('daySum').textContent = s;
  }
  if (Array.isArray(shopData.daysOpen) && shopData.daysOpen.length){
    document.querySelectorAll('#dayRow .dc').forEach(function(b){
      b.classList.toggle('on', shopData.daysOpen.indexOf(+b.dataset.d) > -1);
    });
  }
  document.getElementById('dayRow').addEventListener('click', function(e){
    var b = e.target.closest('.dc'); if (!b) return;
    b.classList.toggle('on'); renderDays();
  });

  // open hours · two native time inputs (recycled shopv3 pattern).
  // blob keeps the chain contract "HH:MM-HH:MM" (hyphen).
  (function(){
    var ot = (shopData.openTime || '10:00-21:00').split('-');
    var os = document.getElementById('openS'), oe = document.getElementById('openE');
    if (os && ot[0]) os.value = ot[0].trim();
    if (oe && ot[1]) oe.value = ot[1].trim();
  })();
  function openTimeStr(){
    var os = document.getElementById('openS'), oe = document.getElementById('openE');
    return ((os && os.value) || '10:00') + '-' + ((oe && oe.value) || '21:00');
  }

  renderCat(); renderVariant(); renderSvc(); renderDep(); renderDays();

  // ── blob · EXACT chain contract + variant + edited services + deposit ──
  function buildBlob(){
    var cleanSvc = services.filter(function(s){ return (s.serviceName||'').trim(); })
      .map(function(s){
        return { serviceName:s.serviceName.trim(),
                 durationMin: s.durationMin, price: s.price };
      });
    return Object.assign({}, shopData, {
      shopName: shopData.shopName,
      shortName: shopData.shortName,
      openTime: openTimeStr(),
      variant: currentVariant,
      categoryName: catName,
      services: cleanSvc,
      depositType: depositType,
      depositValue: depositValue,
      daysOpen: daysOn(),
    });
  }
  function encodeBlob(){
    return btoa(unescape(encodeURIComponent(JSON.stringify(buildBlob()))));
  }

  // SAVE → shopv3 signup prefill (EXACT preserved target · opens claim sheet)
  document.getElementById('saveBtn').addEventListener('click', function(){
    if (!shopData.shopName || !shopData.shortName){
      alert('ไม่มีข้อมูลร้าน · กลับไปหน้าแรกก่อน'); return;
    }
    var url = 'https://shopv3.bookease.co/signup?prefill=' +
      encodeURIComponent(encodeBlob());
    window.open(url, '_blank', 'noopener');
  });

  // peer share URL = this page with ?data= (receiver saves as own · viral)
  function peerUrl(){
    var u = new URL(location.href); u.search = '';
    u.searchParams.set('data', encodeBlob());
    return u.toString();
  }
  document.getElementById('copyBtn').addEventListener('click', function(){
    var btn = this;
    navigator.clipboard.writeText(peerUrl()).then(function(){
      btn.classList.add('copied');
      setTimeout(function(){ btn.classList.remove('copied'); }, 1400);
    }).catch(function(){});
  });
  document.getElementById('shareBtn').addEventListener('click', async function(){
    var btn = this, url = peerUrl();
    if (navigator.share){
      try { await navigator.share({ title: shopData.shopName, url: url }); }
      catch(e){}
    } else {
      try {
        await navigator.clipboard.writeText(url);
        btn.classList.add('copied');
        setTimeout(function(){ btn.classList.remove('copied'); }, 1400);
      } catch(e){}
    }
  });
</script>
</body>
</html>
