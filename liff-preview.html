<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>เว็บร้านของคุณ · BookEase</title>
<meta name="description" content="พรีวิวเว็บร้าน · แก้บริการ · เลือกลุค · บันทึกร้านนี้">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── ONE locked type scale + payouts.tsx colour hierarchy (shipped) ──
     §6c binding mandate · FINAL onboarding mock P2 (Art-locked 2026-05-16):
     section heading = #134783 blue · values #0a0a0a · links #5777EF ·
     meta slate · ONE scale (no เดี๋ยวใหญ่เดี๋ยวเล็ก). Brain (decode /
     save→shopv3 prefill / copy / share) preserved EXACTLY from the
     shipped chain — only the layout becomes the agreed mock panel. */
  :root{
    --ink:#0a0a0a; --head:#134783; --accent:#5777EF; --line:#ececec;
    --cream:#faf7f2; --muted:#6b7280; --faint:#9ca3af; --ok:#10b981;
    --line-green:#06C755;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Sarabun','Inter',system-ui,sans-serif;background:#fff;
    color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;
  }
  .wrap{max-width:480px;margin:0 auto;padding:22px 20px calc(108px + env(safe-area-inset-bottom));}

  /* top: wordmark + login */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .wm{font-family:'Inter';font-weight:800;font-size:19px;letter-spacing:-.01em}
  .wm .b{color:#1E40AF}.wm .e{color:#38BDF8}
  .login{font-size:13px;font-weight:600;color:var(--ink);border:1px solid rgba(0,0,0,.12);
    padding:7px 14px;border-radius:999px;text-decoration:none}

  /* preview hint */
  .pvhint{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 14px}

  /* ตรวจพบ category chip + เปลี่ยน */
  .cat{display:inline-flex;align-items:center;gap:8px;background:#ecfdf5;
    border:1px solid #a7f3d0;border-radius:999px;padding:6px 13px;
    font-size:13px;font-weight:700;color:#065f46;margin-bottom:22px}
  .cat .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .cat .lbl{color:#059669;font-weight:600}
  .cat .chg{color:#059669;text-decoration:underline;font-weight:700;
    background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px;padding:0}

  /* section heading · payouts blue */
  .h{font-size:18px;font-weight:700;color:var(--head);margin:22px 0 10px}
  .h:first-of-type{margin-top:0}

  /* variant pills */
  .vrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
  .vrow::-webkit-scrollbar{display:none}
  .vp{flex:0 0 auto;font-size:14px;font-weight:600;color:var(--faint);
    padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);
    cursor:pointer;font-family:inherit;transition:all .15s}
  .vp.on{color:var(--ink);background:#f1efe9;border-color:#dcd7cd;font-weight:800}
  .vp[data-v="surprise"]{color:#b45309}
  .vp[data-v="surprise"].on{background:#fffbeb;border-color:#fcd34d;color:#b45309}

  /* editable services */
  .svc{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
  .svc:first-of-type{border-top:none}
  .svc .nm{flex:1;min-width:0;font-size:15px;font-weight:600;color:var(--ink);
    border:none;background:transparent;font-family:inherit;padding:2px 0;outline:none}
  .svc .nm:focus{border-bottom:1.5px solid var(--accent)}
  .svc .du{width:62px;text-align:right;font-size:13px;color:var(--muted);
    border:none;background:transparent;font-family:inherit;outline:none}
  .svc .du:focus{color:var(--ink)}
  .svc .duu{font-size:13px;color:var(--muted);margin-left:-6px}
  .svc .pr{width:84px;text-align:right;font-size:15px;font-weight:800;color:var(--ink);
    border:none;background:transparent;font-family:inherit;outline:none;font-variant-numeric:tabular-nums}
  .svc .pr:focus{border-bottom:1.5px solid var(--accent)}
  .svc .pen{color:#cbd5e1;font-size:14px;flex:0 0 auto}
  .svc .del{color:#cbd5e1;background:none;border:none;cursor:pointer;font-size:15px;
    flex:0 0 auto;padding:2px 4px}
  .svc .del:hover{color:#ef4444}
  .addrow{color:var(--accent);font-weight:700;font-size:15px;background:none;border:none;
    cursor:pointer;font-family:inherit;padding:13px 0 4px;display:block}
  .opent{font-size:13px;color:var(--muted);margin:8px 0 2px}
  .opent .ed{color:var(--ink);border:none;background:transparent;font-family:inherit;
    text-decoration:underline dotted;width:130px;outline:none}
  .opent .chg{color:var(--accent);font-weight:600}

  /* deposit segmented */
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:13px;overflow:hidden;margin-top:6px}
  .seg button{flex:1;text-align:center;padding:11px 4px;font-size:13px;font-weight:700;
    color:var(--muted);border:none;border-right:1px solid var(--line);background:#fff;
    cursor:pointer;font-family:inherit}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:#fff}
  .seg .s{display:block;font-size:9px;font-weight:600;opacity:.6;margin-top:2px}
  .seg button.on .s{opacity:.85}
  .dephint{margin-top:9px;font-size:13px;color:#374151}
  .dephint b{color:var(--ink)}

  /* viral bar (preserved verbs · §6c lock · GTM) */
  .viral{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    z-index:50}
  .viral-in{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:stretch}
  .save{flex:1;background:var(--line-green);color:#fff;border:none;border-radius:999px;
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;
    font-weight:800;font-family:inherit;cursor:pointer;min-height:52px;
    box-shadow:0 5px 16px rgba(6,199,85,.28)}
  .save:active{transform:scale(.98)}
  .ico{width:52px;flex:0 0 52px;border:1px solid var(--line);border-radius:15px;
    background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;
    color:#374151;cursor:pointer}
  .ico.copied{background:var(--ok);color:#fff;border-color:var(--ok)}
  .vbar-cap{max-width:480px;margin:8px auto 0;text-align:center;font-size:11px;color:var(--muted)}

  @media (max-width:380px){
    .wrap{padding:18px 14px calc(104px + env(safe-area-inset-bottom))}
    .vp{padding:8px 13px;font-size:13px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="wm"><span class="b">Book</span><span class="e">Ease</span></div>
      <a class="login" href="https://shopv3.bookease.co/login">เข้าสู่ระบบ</a>
    </div>
    <div class="pvhint">← ปัดดูทุกหน้าที่ลูกค้าเห็น · นี่คือเว็บร้านของคุณ →</div>

    <div class="cat">
      <span class="d"></span>
      <span class="lbl">ตรวจพบ:</span>
      <span id="catName">ความงาม</span>
      <button class="chg" id="catChange" type="button">เปลี่ยน</button>
    </div>

    <div class="h">ลุคร้าน</div>
    <div class="vrow" id="variantRow">
      <button class="vp" data-v="airy"     type="button">โปร่ง</button>
      <button class="vp" data-v="luxury"   type="button">หรูหรา</button>
      <button class="vp" data-v="fun"      type="button">สนุก</button>
      <button class="vp" data-v="fresh"    type="button">สดชื่น</button>
      <button class="vp" data-v="surprise" type="button">เซอร์ไพรส์</button>
    </div>

    <div class="h">บริการที่ AI อ่านได้ · แตะแก้</div>
    <div id="svcList"></div>
    <button class="addrow" id="addSvc" type="button">+ เพิ่มบริการ</button>
    <div class="opent">
      เปิด <input class="ed" id="openEd" value="10:00–21:00" /> · ทุกวัน ·
      <span class="chg">แตะแก้</span>
    </div>

    <div class="h">ลูกค้าจ่าย</div>
    <div class="seg" id="depSeg">
      <button data-d="fixed_200" type="button">มัดจำ ฿200<span class="s">เก็บคงที่</span></button>
      <button data-d="percent"   type="button">มัดจำ %<span class="s">ตามราคา</span></button>
      <button data-d="full"      type="button">จ่ายเต็ม<span class="s">เต็มจำนวน ✓</span></button>
    </div>
    <div class="dephint">เงินเข้าร้าน<b>ครบ</b> · กัน no-show 100%</div>
  </div>

  <div class="viral">
    <div class="viral-in">
      <button class="save" id="saveBtn" type="button">✓ บันทึกร้านนี้</button>
      <button class="ico" id="copyBtn" type="button" aria-label="คัดลอกลิงก์">⧉</button>
      <button class="ico" id="shareBtn" type="button" aria-label="แชร์">↗</button>
    </div>
    <div class="vbar-cap">คัดลอกลิงก์ · แชร์ให้เพื่อน → เพื่อน save เป็นร้านตัวเองได้</div>
  </div>

<script>
  // ════════════════════════════════════════════════════════════════
  // BRAIN — preserved EXACTLY from the shipped chain (§6c lock):
  // decode ?data → save → shopv3.bookease.co/signup?prefill= → copy/share
  // ════════════════════════════════════════════════════════════════
  var params = new URLSearchParams(location.search);

  function decodeData(b64){
    try { return JSON.parse(decodeURIComponent(escape(atob(b64)))); }
    catch(e){ return null; }
  }

  var shopData = (function(){
    var d = params.get('data') ? decodeData(params.get('data')) : null;
    if (d) return d;
    return {
      shopName:'Bare Nail Spa', shortName:'barenailspa',
      openTime:'10:00-21:00', variant:'airy',
      categoryName:'ความงาม',
      services:[
        { serviceName:'Manicure คลาสสิก', durationMin:60, price:500 },
        { serviceName:'Gel Polish', durationMin:75, price:800 },
      ],
    };
  })();

  // services normalised to {serviceName,durationMin,price} (the chain shape
  // register_index already decodes). Edits write back here → into the blob.
  var services = Array.isArray(shopData.services) ? shopData.services.map(function(s){
    return {
      serviceName: s.serviceName || s.name || '',
      durationMin: (typeof s.durationMin==='number') ? s.durationMin
                 : (typeof s.durationMinutes==='number') ? s.durationMinutes : null,
      price: (typeof s.price==='number') ? s.price : null,
    };
  }) : [];
  if (services.length === 0) services.push({ serviceName:'', durationMin:null, price:null });

  var currentVariant = ['airy','luxury','fun','fresh','surprise']
    .indexOf(shopData.variant) > -1 ? shopData.variant : 'airy';

  // deposit · default จ่ายเต็ม (full) — §6c · FINAL mock · Art lock 2026-05-16
  var depositType = ['fixed_200','percent','full'].indexOf(shopData.depositType) > -1
    ? shopData.depositType : 'full';
  var depositValue = typeof shopData.depositValue === 'number'
    ? shopData.depositValue
    : (depositType === 'fixed_200' ? 200 : depositType === 'percent' ? 50 : 0);

  // category · light detect mirroring the signup macro vocabulary
  var CATS = ['นวด & สปา','ความงาม','คลินิก','ฟิตเนส','อื่นๆ'];
  function detectCat(name){
    var n = (name||'').toLowerCase();
    if (/นวด|massage|สปา|spa|wellness/.test(n)) return 'นวด & สปา';
    if (/เล็บ|nail|ผม|hair|salon|beauty|ความงาม|คิ้ว|ขนตา|brow|lash/.test(n)) return 'ความงาม';
    if (/คลินิก|clinic|หมอ|skin|derma|aesthetic/.test(n)) return 'คลินิก';
    if (/ฟิต|fitness|gym|yoga|มวย|โยคะ/.test(n)) return 'ฟิตเนส';
    return 'ความงาม';
  }
  var catName = shopData.categoryName && CATS.indexOf(shopData.categoryName) > -1
    ? shopData.categoryName : detectCat(shopData.shopName);

  // ── render ──
  function renderCat(){ document.getElementById('catName').textContent = catName; }
  document.getElementById('catChange').addEventListener('click', function(){
    catName = CATS[(CATS.indexOf(catName) + 1) % CATS.length];
    renderCat();
  });

  function renderVariant(){
    document.querySelectorAll('.vp').forEach(function(b){
      b.classList.toggle('on', b.dataset.v === currentVariant);
    });
  }
  document.getElementById('variantRow').addEventListener('click', function(e){
    var b = e.target.closest('.vp'); if (!b) return;
    currentVariant = b.dataset.v; renderVariant();
  });

  function renderSvc(){
    var box = document.getElementById('svcList');
    box.innerHTML = '';
    services.forEach(function(s, i){
      var row = document.createElement('div');
      row.className = 'svc';
      row.innerHTML =
        '<input class="nm" placeholder="ชื่อบริการ" />' +
        '<input class="du" inputmode="numeric" placeholder="–" />' +
        '<span class="duu">น</span>' +
        '<input class="pr" inputmode="numeric" placeholder="฿" />' +
        '<span class="pen">✎</span>' +
        '<button class="del" type="button" aria-label="ลบ">×</button>';
      var nm = row.querySelector('.nm'), du = row.querySelector('.du'),
          pr = row.querySelector('.pr');
      nm.value = s.serviceName || '';
      du.value = (s.durationMin != null) ? s.durationMin : '';
      pr.value = (s.price != null) ? s.price : '';
      nm.addEventListener('input', function(){ services[i].serviceName = nm.value; });
      du.addEventListener('input', function(){
        du.value = du.value.replace(/\D/g,''); services[i].durationMin = du.value ? +du.value : null;
      });
      pr.addEventListener('input', function(){
        pr.value = pr.value.replace(/\D/g,''); services[i].price = pr.value ? +pr.value : null;
      });
      row.querySelector('.del').addEventListener('click', function(){
        services.splice(i,1);
        if (services.length === 0) services.push({serviceName:'',durationMin:null,price:null});
        renderSvc();
      });
      box.appendChild(row);
    });
  }
  document.getElementById('addSvc').addEventListener('click', function(){
    services.push({ serviceName:'', durationMin:null, price:null });
    renderSvc();
  });

  function renderDep(){
    document.querySelectorAll('#depSeg button').forEach(function(b){
      b.classList.toggle('on', b.dataset.d === depositType);
    });
  }
  document.getElementById('depSeg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    depositType = b.dataset.d;
    depositValue = depositType === 'fixed_200' ? 200 : depositType === 'percent' ? 50 : 0;
    renderDep();
  });

  // open hours (display uses en-dash; blob uses hyphen — chain contract)
  var openEd = document.getElementById('openEd');
  openEd.value = (shopData.openTime || '10:00-21:00').replace('-', '–');

  renderCat(); renderVariant(); renderSvc(); renderDep();

  // ── blob · EXACT chain contract + variant + edited services + deposit ──
  function buildBlob(){
    var cleanSvc = services.filter(function(s){ return (s.serviceName||'').trim(); })
      .map(function(s){
        return { serviceName:s.serviceName.trim(),
                 durationMin: s.durationMin, price: s.price };
      });
    return Object.assign({}, shopData, {
      shopName: shopData.shopName,
      shortName: shopData.shortName,
      openTime: (openEd.value || '10:00–21:00').replace('–','-'),
      variant: currentVariant,
      categoryName: catName,
      services: cleanSvc,
      depositType: depositType,
      depositValue: depositValue,
    });
  }
  function encodeBlob(){
    return btoa(unescape(encodeURIComponent(JSON.stringify(buildBlob()))));
  }

  // SAVE → shopv3 signup prefill (EXACT preserved target · opens claim sheet)
  document.getElementById('saveBtn').addEventListener('click', function(){
    if (!shopData.shopName || !shopData.shortName){
      alert('ไม่มีข้อมูลร้าน · กลับไปหน้าแรกก่อน'); return;
    }
    var url = 'https://shopv3.bookease.co/signup?prefill=' +
      encodeURIComponent(encodeBlob());
    window.open(url, '_blank', 'noopener');
  });

  // peer share URL = this page with ?data= (receiver saves as own · viral)
  function peerUrl(){
    var u = new URL(location.href); u.search = '';
    u.searchParams.set('data', encodeBlob());
    return u.toString();
  }
  document.getElementById('copyBtn').addEventListener('click', function(){
    var btn = this;
    navigator.clipboard.writeText(peerUrl()).then(function(){
      btn.classList.add('copied');
      setTimeout(function(){ btn.classList.remove('copied'); }, 1400);
    }).catch(function(){});
  });
  document.getElementById('shareBtn').addEventListener('click', async function(){
    var btn = this, url = peerUrl();
    if (navigator.share){
      try { await navigator.share({ title: shopData.shopName, url: url }); }
      catch(e){}
    } else {
      try {
        await navigator.clipboard.writeText(url);
        btn.classList.add('copied');
        setTimeout(function(){ btn.classList.remove('copied'); }, 1400);
      } catch(e){}
    }
  });
</script>
</body>
</html>
