<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>รายงานโปรโมทร้าน · bookease</title>
<link rel="icon" href="../../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14110F;--ink-2:#4A4440;--ink-3:#7A726C;--line:#ECE7E2;--ground:#FBF8F5;--card:#FFFFFF;--accent:#2D55EB;--accent-soft:#EEF2FD;--good:#15803D;--good-soft:#E8F5EC;--bad:#B91C1C;--muted:#B4BAC5;--na:#F3F0EC}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:Anuphan,Inter,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top img{height:20px}
header.top span{font:600 13px Anuphan;color:var(--ink-3)}
.title h1{font:700 26px/1.25 Anuphan;letter-spacing:-.01em;text-wrap:balance}
.title p{color:var(--ink-3);font-size:14px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
h2{font:700 19px Anuphan;margin-bottom:8px}
.lead{color:var(--ink-3);font-size:13.5px;margin:-4px 0 10px}
.log{list-style:none}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log time{font:600 13px Inter;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.log b{display:inline;font-weight:600;font-size:16px}
.log small{color:var(--ink-3);font-size:13px}
.log a{font-size:13px;font-weight:600;text-decoration:none}
.staff{border:2px dashed var(--line)}
button{font:700 15px Anuphan;border:0;border-radius:999px;padding:11px 18px;background:var(--accent);color:#fff;cursor:pointer;margin-top:10px}
button.soft{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.foot{color:var(--ink-3);font-size:12.5px;text-align:center}
.busy{padding:60px 0;text-align:center;color:var(--ink-3)}
.err{padding:40px 0;color:var(--bad)}
.weekcard{width:100%;max-width:440px;display:block;margin:0 auto;border-radius:20px;border:1px solid var(--line);background:#fff;min-height:200px}
.cardtext{font:800 28px/1.3 Anuphan;color:var(--accent)}
.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;padding:8px 0}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="busy">กำลังโหลดรายงาน…</p></main>
<script>
const API = 'https://bookease-maps-report.atiz-cloudflare-account.workers.dev';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qs = new URLSearchParams(location.search);
const P = qs.get('p') || '';
// The owner taps this once and sends the prefilled message in @bookease; the worker links their LINE to this shop.
const lineLinkUrl = `https://line.me/R/oaMessage/%40bookease/?${encodeURIComponent(`เชื่อมรายงาน ${P}`)}`;
const STAFF = qs.has('staff');
// A device that opened the team view stops counting its own visits to shop pages and menus.
if (STAFF) { try { localStorage.setItem('bookease-staff', '1'); } catch (e) { console.error('[growth] storage', e); } }
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const thDate = (iso) => { const [y, m, d] = iso.slice(0, 10).split('-').map(Number); return `${d} ${TH_MONTHS[m - 1]}`; };
const thDateY = (iso) => `${thDate(iso)} ${(Number(iso.slice(0, 4)) + 543) % 100}`;
const bkk = (iso) => new Date(Date.parse(iso) + 7 * 3600e3).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400e3);
const ACT = { view: 'เปิดดู', call: 'กดโทร', map: 'กดนำทาง', web: 'กดไปเว็บหรือเพจ', line: 'กด LINE', book: 'กดจอง', review: 'กดดูรีวิว', open: 'กดดูร้าน' };
const CONTACT = ['call', 'map', 'web', 'line', 'book'];

// The owner's page (Art 2026-11-20): the same picture card they get in LINE, then the work we did and what we do
// next, in plain words. No dashboard: no number grids, no 9-square maps, no tables, no "where customers saw you"
// list — Art rejected that version ("looks like a normal dashboard for educated people").
function render(d) {
  const s = d.shop, today = d.today;
  document.title = `รายงานโปรโมทร้าน · ${s.name}`;
  const work = (e) => esc(e.short || e.what);
  const log = [...d.log].sort((a, b) => b.at.localeCompare(a.at));
  const SHOW = 6;
  const logHtml = log.length
    ? `<ul class="log">${log.slice(0, SHOW).map((e) => `<li><time>${thDate(e.at)}</time><div><b>${work(e)}</b>${e.evidence ? ` <a href="${esc(e.evidence)}" target="_blank" rel="noopener">ดูรูป</a>` : ''}</div></li>`).join('')}</ul>`
      + (log.length > SHOW ? `<details class="more"><summary>ดูงานก่อนหน้าอีก ${log.length - SHOW} งาน</summary><ul class="log">${log.slice(SHOW).map((e) => `<li><time>${thDate(e.at)}</time><div><b>${work(e)}</b></div></li>`).join('')}</ul></details>` : '')
    : '<p class="lead">สัปดาห์นี้เรากำลังเริ่มงานให้ร้านคุณ</p>';
  const plan = (d.plan || []).length > 2 // the card already lists the next two
    ? `<section class="card"><h2>งานต่อไปทั้งหมด</h2><ul class="log">${d.plan.map((x) => `<li><time>ต่อไป</time><div><b>${work(x)}</b></div></li>`).join('')}</ul></section>` : '';

  $('app').innerHTML = `
    <header class="top"><img src="../../brand/bookease-logo.svg" alt="bookease"><span>${esc(s.name)}</span></header>
    <img class="weekcard" id="weekcard" alt="${esc(d.card.headline)} · ${esc(d.card.calls)}">
    <section class="card" id="work"><h2>งานทั้งหมดที่เราทำให้ร้าน</h2>${logHtml}</section>
    ${plan}
    <p class="foot">มีคำถาม ทักเราได้ที่ <a href="https://line.me/R/ti/p/@bookease" target="_blank" rel="noopener">LINE @bookease</a></p>
    ${STAFF ? `<section class="card staff"><h2>ส่งการ์ดอัตโนมัติทาง LINE (สำหรับทีม)</h2>
      ${d.lineLinked ? `<p class="lead">เชื่อม LINE ของร้านแล้ว · ระบบส่งการ์ดให้เองทุกวันจันทร์ 10:00${d.linePushedAt ? ` · ส่งล่าสุด ${esc(thDateY(d.linePushedAt.slice(0, 10)))}` : ''}</p>`
        : `<p class="lead">ยังไม่เชื่อม: ส่งลิงก์นี้ให้เจ้าของร้าน กดแล้วกด "ส่ง" ในแชต @bookease ครั้งเดียว จากนั้นการ์ดจะไปถึงร้านเองทุกวันจันทร์</p>
      <p><a id="linelink" href="${esc(lineLinkUrl)}" target="_blank" rel="noopener">${esc(lineLinkUrl)}</a> <button id="copyline" class="soft">คัดลอกลิงก์เชื่อม LINE</button></p>`}</section>
    <section class="card staff"><h2>ส่งรายงานวันจันทร์ทาง LINE (สำหรับทีม)</h2>
      <p class="lead">1) ส่งรูปการ์ดนี้ให้ร้าน 2) ส่งลิงก์รายงานตามไป</p>
      <img id="cardimg" alt="การ์ดรายงานประจำสัปดาห์" style="width:100%;max-width:420px;display:block;border-radius:14px">
      <button id="share">ส่งรูปการ์ดทาง LINE</button> <button id="save" class="soft">บันทึกรูป</button> <button id="copylink" class="soft">คัดลอกลิงก์รายงาน</button> <span id="ok" hidden>คัดลอกแล้ว</span></section>` : ''}`;
  cardBlob(d.card).then((blob) => { $('weekcard').src = URL.createObjectURL(blob); })
    .catch((e) => { console.error('[growth] owner card', e); $('weekcard').replaceWith(Object.assign(document.createElement('h1'), { className: 'cardtext', textContent: d.card.headline })); });
  if (location.hash === '#work') requestAnimationFrame(() => $('work').scrollIntoView({ block: 'start' }));
  if (STAFF) {
    const copyLine = $('copyline');
    if (copyLine) copyLine.addEventListener('click', () => navigator.clipboard.writeText(lineLinkUrl).catch((e) => console.error('[growth] copy line link', e)));
    const copy = async (text, onFail) => {
      try { await navigator.clipboard.writeText(text); $('ok').hidden = false; } catch (e) { console.error('[growth] copy', e); onFail && onFail(); }
    };
    $('copylink').addEventListener('click', () => copy(d.card.url));
    cardBlob(d.card).then((blob) => {
      const file = new File([blob], `bookease-${s.id.slice(-6)}-week${d.card.week}.png`, { type: 'image/png' });
      $('cardimg').src = URL.createObjectURL(blob);
      $('save').addEventListener('click', () => { const a = document.createElement('a'); a.href = $('cardimg').src; a.download = file.name; a.click(); });
      $('share').addEventListener('click', async () => {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== 'AbortError') console.error('[growth] share', e); }
        } else $('save').click(); // computer: save, then drag the picture into LINE
      });
    }).catch((e) => console.error('[growth] card', e));
  }
}

// ── The weekly card as a picture (the team sends it in LINE until the bot pushes the same card itself) ──
const seg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
function wrapLines(ctx, text, maxW) {
  const words = seg ? [...seg.segment(text)].map((x) => x.segment) : text.split(/(?<=\s)/);
  const lines = []; let line = '';
  for (const w of words) {
    if (ctx.measureText(line + w).width > maxW && line) { lines.push(line.trimEnd()); line = w.trimStart(); } else line += w;
  }
  if (line) lines.push(line);
  return lines;
}
async function cardBlob(c) {
  // The approved weekly card (Art 2026-11-16), drawn as a picture: same content as the LINE flex card.
  await Promise.all(['600 14px Anuphan', '700 16px Anuphan', '800 30px Anuphan', '800 17px Inter'].map((f) => document.fonts.load(f)));
  let photo = null;
  if (c.photo) {
    photo = await new Promise((ok) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => ok(im); im.onerror = (e) => { console.error('[growth] card photo', e); ok(null); }; im.src = c.photo; });
  }
  const K = 3, W = 340 * K, P = 22 * K, canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
  const font = (w, px, fam = 'Anuphan') => `${w} ${px * K}px ${fam}`;
  const paint = (draw) => {
    let y = P;
    const text = (str, f, color, lh, x = P, maxW = W - P - x) => {
      ctx.font = f; ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const lines = wrapLines(ctx, str, maxW);
      lines.forEach((l, i) => draw && ctx.fillText(l, x, y + i * lh * K));
      y += lines.length * lh * K;
    };
    const rr = (x, yy, w, h, r, fill, stroke) => { ctx.beginPath(); ctx.roundRect(x, yy, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.setLineDash([6 * K / 2, 4 * K / 2]); ctx.lineWidth = 2 * K; ctx.strokeStyle = stroke; ctx.stroke(); ctx.setLineDash([]); } };
    // logo + week
    if (draw) {
      ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.font = font(800, 17, 'Inter');
      ctx.fillStyle = '#0A0A0A'; ctx.fillText('book', P, y); const bw = ctx.measureText('book').width; ctx.fillStyle = '#2D55EB'; ctx.fillText('ease', P + bw, y);
      ctx.font = font(600, 13); ctx.fillStyle = '#8A827B'; ctx.textAlign = 'right'; ctx.fillText(`สัปดาห์ที่ ${c.week}`, W - P, y + 2 * K);
    }
    y += 34 * K;
    text(c.headline, font(800, 30), c.color, 38);
    if (c.from) { y += 2 * K; text(c.from, font(700, 16), c.color, 24); }
    if (c.where) { y += 2 * K; text(c.where, font(600, 13.5), '#8A827B', 20); }
    // ladder
    if (c.ladder.length) {
      y += 14 * K;
      const numW = 30 * K, barX = P + numW + 10 * K, barW = W - P - barX, rowH = 40 * K;
      for (const row of c.ladder) {
        if (row.kind === 'gap') { if (draw) { ctx.font = font(700, 14, 'Inter'); ctx.fillStyle = '#8A827B'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('· · ·', W / 2, y + 7 * K); } y += 16 * K; continue; }
        if (draw) {
          ctx.font = font(800, 17, 'Inter'); ctx.fillStyle = row.kind === 'me' ? c.color : '#8A827B'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          ctx.fillText(row.n, P + numW, y + rowH / 2);
          if (row.kind === 'me') {
            rr(barX, y, barW, rowH, 12 * K, c.color);
            let tx = barX + 14 * K;
            if (photo) {
              const d = 30 * K, cx = barX + 6 * K + d / 2, cy = y + rowH / 2;
              ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2); ctx.clip();
              const sz = Math.min(photo.width, photo.height); ctx.drawImage(photo, (photo.width - sz) / 2, (photo.height - sz) / 2, sz, sz, cx - d / 2, cy - d / 2, d, d); ctx.restore();
              ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2); ctx.lineWidth = 2 * K; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
              tx = barX + 6 * K + d + 10 * K;
            }
            ctx.font = font(700, 16); ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'left'; ctx.fillText('ร้านคุณ', tx, y + rowH / 2);
          } else if (row.kind === 'was') {
            rr(barX + K, y + K, barW - 2 * K, rowH - 2 * K, 12 * K, null, '#D9D2CB');
            ctx.font = font(600, 14); ctx.fillStyle = '#8A827B'; ctx.textAlign = 'left'; ctx.fillText('สัปดาห์ก่อน', barX + 12 * K, y + rowH / 2);
          } else rr(barX, y, barW, rowH, 12 * K, '#EFEBE7');
        }
        y += rowH + 6 * K;
      }
      y -= 6 * K;
    }
    // calls
    y += 16 * K;
    const boxH = 54 * K;
    if (draw) {
      rr(P, y, W - 2 * P, boxH, 16 * K, '#F7F5F2');
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.font = `${26 * K}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText('📞', P + 16 * K, y + boxH / 2);
      ctx.font = font(700, 17); ctx.fillStyle = '#14110F'; ctx.fillText(c.calls, P + 56 * K, y + boxH / 2);
    }
    y += boxH;
    // The rest of the report, readable without opening anything (Art 2026-11-17/20): this week's work, where the
    // shop is shown, next week's plan. Plain lines, no chips, no numbers.
    const section = (title, lines) => {
      if (!lines.length) return;
      y += 18 * K;
      if (draw) { ctx.fillStyle = '#EFEBE7'; ctx.fillRect(P, y, W - 2 * P, 1.5 * K); }
      y += 16 * K;
      text(title, font(700, 16), '#14110F', 24);
      y += 4 * K;
      for (const line of lines) { text(`•  ${line}`, font(600, 15), '#4A4440', 23); y += 4 * K; }
    };
    section('สัปดาห์นี้เราทำให้ร้าน', [...(c.done || []), ...(c.doneMore ? [`และอีก ${c.doneMore} งาน`] : [])]);
    section('ร้านคุณอยู่ที่', c.shownOn || []);
    section('สัปดาห์หน้าเราจะทำ', c.next || []);
    // No button on the picture: it is read in the chat as it is; the report link is sent as a message after it.
    y += P;
    return y;
  };
  const H = paint(false);
  canvas.width = W; canvas.height = H;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  paint(true);
  return new Promise((ok, no) => canvas.toBlob((b) => (b ? ok(b) : no(new Error('toBlob failed'))), 'image/png'));
}

async function load() {
  if (!/^[A-Za-z0-9_-]{10,200}$/.test(P)) { $('app').innerHTML = '<p class="err">ไม่พบร้าน</p>'; return; }
  const r = await fetch(`${API}/growth?p=${encodeURIComponent(P)}`);
  const d = await r.json();
  if (r.status === 404) { $('app').innerHTML = '<p class="err">ร้านนี้ยังไม่ได้เริ่มบริการโปรโมทร้าน</p>'; return; }
  if (!r.ok) throw new Error(d.error || r.status);
  render(d);
}
load().catch((e) => { console.error('[growth] load', e); $('app').innerHTML = '<p class="err">เปิดรายงานไม่ได้ ลองกดเปิดลิงก์ใหม่อีกครั้ง</p>'; });
</script>
</body>
</html>
