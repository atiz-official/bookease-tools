<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>รายงานโปรโมทร้าน · bookease</title>
<link rel="icon" href="../../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14110F;--ink-2:#4A4440;--ink-3:#7A726C;--line:#ECE7E2;--ground:#FBF8F5;--card:#FFFFFF;--accent:#2D55EB;--accent-soft:#EEF2FD;--good:#15803D;--good-soft:#E8F5EC;--bad:#B91C1C;--muted:#B4BAC5;--na:#F3F0EC}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:Anuphan,Inter,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top img{height:20px}
header.top span{font:600 13px Anuphan;color:var(--ink-3)}
.title h1{font:700 26px/1.25 Anuphan;letter-spacing:-.01em;text-wrap:balance}
.title p{color:var(--ink-3);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat small{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.4}
.stat b{display:block;font:800 28px/1.15 Inter;font-variant-numeric:tabular-nums;margin-top:4px}
.stat b i{font:600 14px Anuphan;font-style:normal;color:var(--ink-3)}
.stat .d{font-size:13px;color:var(--ink-3)}
.stat .d.up{color:var(--good)}.stat .d.down{color:var(--bad)}
.stat.na b{font:600 15px/1.4 Anuphan;color:var(--ink-3)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
h2{font:700 19px Anuphan;margin-bottom:8px}
.lead{color:var(--ink-3);font-size:13.5px;margin:-4px 0 10px}
.log{list-style:none}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log time{font:600 13px Inter;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.log b{display:block;font-weight:600;font-size:15px}
.log small{color:var(--ink-3);font-size:13px}
.log a{font-size:13px;font-weight:600;text-decoration:none}
.chan{display:flex;flex-direction:column}
.ch{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.ch:last-child{border-bottom:0}
.ch b{font-size:15.5px}
.ch small{grid-column:1/-1;color:var(--ink-2);font-size:14px}
.pill{font:600 12.5px Anuphan;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--na);color:var(--ink-3)}
.pill.on{background:var(--good-soft);color:var(--good)}
.grids{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;grid-column:1/-1}
.g9{display:grid;grid-template-columns:repeat(3,34px);gap:4px}
.g9 span{height:34px;border-radius:8px;display:grid;place-items:center;font:700 13px Inter;color:#fff;background:var(--muted)}
.g9 span.t3{background:var(--good)}.g9 span.t10{background:#5B8F6B}.g9 span.far{background:#C9B9A6}.g9 span.no{background:#E4DFD9;color:var(--ink-3)}
.g9 span.c{outline:2px solid var(--ink);outline-offset:1px}
.gcap{font-size:12.5px;color:var(--ink-3);margin-top:4px;text-align:center}
.legend{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.spark{grid-column:1/-1;margin-top:6px}
.prog{width:100%;border-collapse:collapse;font-size:14.5px}
.prog th{font:600 12.5px Anuphan;color:var(--ink-3);text-align:right;padding:0 0 6px}
.prog th:first-child,.prog td:first-child{text-align:left}
.prog td{padding:9px 0 9px 10px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top;white-space:nowrap}
.prog td:first-child{white-space:normal;padding-left:0}
.prog th{white-space:nowrap;padding-left:10px;line-height:1.35}
.prog td b{font:700 15px Inter}
.prog .chg{display:block;font-size:12.5px;color:var(--ink-3)}
.prog .chg.up{color:var(--good)}.prog .chg.down{color:var(--bad)}
.vs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.vs .arrow{font:700 20px Inter;color:var(--ink-3)}
.trend{margin-top:12px}
.trend small{display:block;font-size:12.5px;color:var(--ink-3)}
.staff{border:2px dashed var(--line)}
textarea{width:100%;min-height:230px;font:15px/1.55 Anuphan;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--ground);color:var(--ink);resize:vertical}
button{font:700 15px Anuphan;border:0;border-radius:999px;padding:11px 18px;background:var(--accent);color:#fff;cursor:pointer;margin-top:10px}
button.soft{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.foot{color:var(--ink-3);font-size:12.5px;text-align:center}
.busy{padding:60px 0;text-align:center;color:var(--ink-3)}
.err{padding:40px 0;color:var(--bad)}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="busy">กำลังโหลดรายงาน…</p></main>
<script>
const API = 'https://bookease-maps-report.atiz-cloudflare-account.workers.dev';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qs = new URLSearchParams(location.search);
const P = qs.get('p') || '';
const STAFF = qs.has('staff');
// A device that opened the team view stops counting its own visits to shop pages and menus.
if (STAFF) { try { localStorage.setItem('bookease-staff', '1'); } catch (e) { console.error('[growth] storage', e); } }
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const thDate = (iso) => { const [y, m, d] = iso.slice(0, 10).split('-').map(Number); return `${d} ${TH_MONTHS[m - 1]}`; };
const thDateY = (iso) => `${thDate(iso)} ${(Number(iso.slice(0, 4)) + 543) % 100}`;
const bkk = (iso) => new Date(Date.parse(iso) + 7 * 3600e3).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400e3);
const ACT = { view: 'เปิดดู', call: 'กดโทร', map: 'กดนำทาง', web: 'กดไปเว็บหรือเพจ', line: 'กด LINE', book: 'กดจอง', review: 'กดดูรีวิว', open: 'กดดูร้าน' };
const CONTACT = ['call', 'map', 'web', 'line', 'book'];

/** Sum counts for days in [from, to] (Bangkok dates), optionally only some actions / sources. */
function sum(counts, from, to, acts, srcTest) {
  let n = 0;
  for (const [day, row] of Object.entries(counts || {})) {
    if (day < from || day > to) continue;
    for (const [k, v] of Object.entries(row)) {
      const [a, src] = k.split('|');
      if (acts && !acts.includes(a)) continue;
      if (srcTest && !srcTest(src)) continue;
      n += v;
    }
  }
  return n;
}
const addDays = (day, n) => new Date(Date.parse(day) + n * 86400e3).toISOString().slice(0, 10);

function g9(snap, i, cap) {
  const s = snap.spacings[i];
  const cells = s.ranks.map((r, k) => {
    const cls = r == null ? 'no' : r <= 3 ? 't3' : r <= 10 ? 't10' : 'far';
    return `<span class="${cls}${k === 4 ? ' c' : ''}" title="${r == null ? `ไม่ติด ${snap.maxRank} อันดับแรก` : `อันดับ ${r}`}">${r == null ? '–' : r}</span>`;
  }).join('');
  return `<div><div class="g9">${cells}</div><div class="gcap">${cap || (s.m >= 1000 ? `จุดห่างกัน ${s.m / 1000} กม.` : `จุดห่างกัน ${s.m} ม.`)}</div></div>`;
}

function spark(hist, i) {
  if (hist.length < 2) return '';
  const vals = hist.map((h) => h.spacings[i].top3);
  const w = 220, h = 46, step = w / (vals.length - 1);
  const pts = vals.map((v, k) => `${(k * step).toFixed(1)},${(h - 6 - (v / 9) * (h - 12)).toFixed(1)}`).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="จำนวนจุดที่ติด 3 อันดับแรก แต่ละสัปดาห์: ${vals.join(', ')}">
    <line x1="0" y1="${h - 6}" x2="${w}" y2="${h - 6}" stroke="#ECE7E2"/><polyline points="${pts}" fill="none" stroke="#15803D" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.6" fill="#15803D"/></svg>`;
}

/** "Since we started": first check vs latest, so the owner sees whether the shop moved up. */
function progress(hist) {
  const first = hist[0], last = hist[hist.length - 1];
  if (!first) return '';
  if (hist.length < 2) {
    return `<section class="card"><h2>ร้านคุณดีขึ้นไหม</h2><p class="lead" style="margin:0">เราลองค้นครั้งแรกวันที่ ${thDateY(bkk(first.at))} · ครั้งต่อไปประมาณ ${thDateY(addDays(bkk(first.at), 7))} แล้วจะบอกได้ว่าร้านคุณขึ้นหรือลง</p></section>`;
  }
  const hub = (snap) => (snap.hub ? snap.hub.rank : undefined);
  // kind 'count' (more is better) or 'rank' (a smaller number is better)
  const row = (label, a, b, fmt, kind) => {
    let chg = '<span class="chg">เท่าเดิม</span>';
    if (a == null && b != null) chg = '<span class="chg up">เริ่มเจอร้านคุณ</span>';
    else if (a != null && b == null) chg = '<span class="chg down">ไม่เจอร้านคุณแล้ว</span>';
    else if (a != null && b != null && a !== b) {
      const d = Math.abs(b - a), better = kind === 'rank' ? b < a : b > a;
      const words = kind === 'rank' ? (better ? `↑ ขึ้นมา ${d} ลำดับ` : `↓ ตกลง ${d} ลำดับ`) : (better ? `↑ เพิ่ม ${d}` : `↓ ลด ${d}`);
      chg = `<span class="chg ${better ? 'up' : 'down'}">${words}</span>`;
    }
    return `<tr><td>${label}</td><td>${fmt(a)}</td><td><b>${fmt(b)}</b>${chg}</td></tr>`;
  };
  const of9 = (v) => `${v}`;
  const rk = (v) => (v == null ? `ไม่อยู่ใน ${last.maxRank} ร้านแรก` : `ร้านที่ ${v}`);
  const n = (v) => (v == null ? '–' : `${v}`);
  const rows = [
    row('คนค้นแถวร้าน เห็นร้านคุณใน 3 ร้านแรก (กี่จุด จาก 9 จุด)', first.spacings[0].top3, last.spacings[0].top3, of9, 'count'),
    row('คนที่อยู่ไกลออกไป 2 กม. เห็นร้านคุณใน 3 ร้านแรก (กี่จุด จาก 9 จุด)', first.spacings[1].top3, last.spacings[1].top3, of9, 'count'),
  ];
  if (first.hub && last.hub) rows.push(row(`คนค้นจาก ${esc(last.hub.name)} เห็นร้านคุณเป็น`, hub(first), hub(last), rk, 'rank'));
  if (first.reviews != null && last.reviews != null) rows.push(row('รีวิวร้านคุณใน Google', first.reviews, last.reviews, n, 'count'));
  const weeks = Math.max(1, Math.round(daysBetween(bkk(first.at), bkk(last.at)) / 7));
  const wideVals = hist.map((h) => h.spacings[1].top3);
  return `<section class="card"><h2>ร้านคุณดีขึ้นไหม</h2><p class="lead">เทียบครั้งแรกที่เราลองค้น กับครั้งล่าสุด (ห่างกัน ${weeks} สัปดาห์)</p>
    <table class="prog"><thead><tr><th></th><th>ครั้งแรก<br>${thDate(bkk(first.at))}</th><th>ล่าสุด<br>${thDate(bkk(last.at))}</th></tr></thead><tbody>${rows.join('')}</tbody></table>
    <div class="vs">${g9(first, 1, `ครั้งแรก ${thDate(bkk(first.at))}`)}<span class="arrow" aria-hidden="true">→</span>${g9(last, 1, `ล่าสุด ${thDate(bkk(last.at))}`)}</div>
    <p class="legend" style="margin-top:6px">9 ช่อง คือ 9 จุดที่เราลองค้น ห่างกันจุดละ 2 กม. · ช่องกลางกรอบดำคือร้านคุณ · ตัวเลขคือร้านคุณขึ้นเป็นร้านที่เท่าไร · สีเขียวเข้มคือขึ้นใน 3 ร้านแรก</p>
    <div class="trend">${spark(hist, 1)}<small>แต่ละสัปดาห์ ร้านคุณขึ้นใน 3 ร้านแรกกี่จุด (คนที่อยู่ไกลออกไป 2 กม.): ${wideVals.join(' → ')}</small></div></section>`;
}

function render(d) {
  const s = d.shop, today = d.today;
  const week = Math.max(1, Math.floor(daysBetween(s.since, today) / 7) + 1);
  const from7 = addDays(today, -6);
  const hist = d.hist, last = hist[hist.length - 1], prev = hist[hist.length - 2], first = hist[0];
  document.title = `รายงานโปรโมทร้าน · ${s.name}`;

  // ── headline numbers (measured, or "ยังวัดไม่ได้") ──
  const delta = (now, before) => before == null || now == null ? '' : now > before ? `<span class="d up">↑ เพิ่ม ${now - before} จากสัปดาห์ก่อน</span>` : now < before ? `<span class="d down">↓ ลด ${before - now} จากสัปดาห์ก่อน</span>` : '<span class="d">เท่ากับสัปดาห์ก่อน</span>';
  const stat = (label, value, extra) => `<div class="stat"><small>${label}</small><b>${value}</b>${extra || ''}</div>`;
  const na = (label, why) => `<div class="stat na"><small>${label}</small><b>ยังวัดไม่ได้</b><span class="d">${why}</span></div>`;
  const firstCheck = 'เราจะลองค้นครั้งแรกตอนร้านเปิด';
  const views7 = sum(d.counts, from7, today, ['view']);
  const contacts7 = sum(d.counts, from7, today, CONTACT);
  const L1 = 'คนค้นหาแถวร้าน เห็นร้านคุณใน 3 ร้านแรก', L2 = 'คนที่อยู่ไกลออกไป 2 กม. เห็นร้านคุณใน 3 ร้านแรก';
  const stats = [
    last ? stat(L1, `${last.spacings[0].top3}<i> จาก 9 จุด</i>`, delta(last.spacings[0].top3, prev && prev.spacings[0].top3)) : na(L1, firstCheck),
    last ? stat(L2, `${last.spacings[1].top3}<i> จาก 9 จุด</i>`, delta(last.spacings[1].top3, prev && prev.spacings[1].top3)) : na(L2, firstCheck),
    last && last.reviews != null ? stat('รีวิวร้านคุณใน Google', `${last.reviews}`, first && first !== last ? `<span class="d${last.reviews > first.reviews ? ' up' : ''}">${last.reviews > first.reviews ? `↑ เพิ่ม ${last.reviews - first.reviews} ตั้งแต่เริ่ม` : 'เท่ากับวันเริ่ม'}</span>` : '<span class="d">สัปดาห์แรก ไว้เทียบครั้งต่อไป</span>') : na('รีวิวร้านคุณใน Google', firstCheck),
    stat('คนกดโทร กดนำทาง หรือติดต่อร้าน (7 วันล่าสุด)', `${contacts7}`, `<span class="d">คนเปิดดูหน้าร้าน ${views7} ครั้ง</span>`),
  ].join('');

  // ── work log ──
  const log = [...d.log].sort((a, b) => b.at.localeCompare(a.at));
  const logHtml = log.length ? `<ul class="log">${log.map((e) => `<li><time>${thDate(e.at)}</time><div><b>${esc(e.what)}</b>
    <small>${esc([e.where, e.minutes ? `${e.minutes} นาที` : ''].filter(Boolean).join(' · '))}</small>${e.evidence ? ` · <a href="${esc(e.evidence)}" target="_blank" rel="noopener">ดูหลักฐาน</a>` : ''}</div></li>`).join('')}</ul>`
    : '<p class="lead">ยังไม่มีงานที่บันทึก</p>';

  // ── channels: where the shop was put in front of people ──
  const ch = [];
  if (last) {
    ch.push(`<div class="ch"><b>Google Maps · เมื่อคนค้นคำว่า "${esc(last.keyword)}"</b><span class="pill on">ลองค้นทุกสัปดาห์</span>
      <small>ลองค้นล่าสุด ${thDateY(bkk(last.at))} · คนค้นแถวร้าน เห็นร้านคุณใน 3 ร้านแรก ${last.spacings[0].top3} จาก 9 จุด${last.hub ? ` · คนค้นจาก ${esc(last.hub.name)} ${last.hub.rank ? `เห็นร้านคุณเป็นร้านที่ ${last.hub.rank}` : `ไม่เห็นร้านคุณใน ${last.maxRank} ร้านแรก`}` : ''}</small>
      <div class="grids">${g9(last, 0, 'แถวร้าน (ห่างกันจุดละ 500 ม.)')}${g9(last, 1, 'ไกลออกไป (ห่างกันจุดละ 2 กม.)')}</div>
      <p class="legend">9 ช่อง คือ 9 จุดที่เราลองค้น · ช่องกลางกรอบดำคือร้านคุณ · ตัวเลขคือร้านคุณขึ้นเป็นร้านที่เท่าไร · สีเขียวเข้มคือขึ้นใน 3 ร้านแรก · ขีด (–) คือไม่เจอร้านคุณใน ${last.maxRank} ร้านแรก</p></div>`);
  } else {
    ch.push(`<div class="ch"><b>Google Maps</b><span class="pill">ยังวัดไม่ได้</span><small>${firstCheck} (ตอนร้านปิด Google จะดันร้านลง ผลจะไม่ตรง)</small></div>`);
  }
  const siteViews = sum(d.counts, s.since, today, ['view'], (x) => !x.startsWith('b:'));
  const siteContacts = sum(d.counts, s.since, today, CONTACT, (x) => !x.startsWith('b:'));
  ch.push(`<div class="ch"><b>เว็บร้าน</b><span class="pill on">นับตั้งแต่ ${thDate(s.since)}</span>
    <small>คนเปิดดู ${siteViews} ครั้ง · กดติดต่อ ${siteContacts} ครั้ง${siteContacts ? ` (${CONTACT.map((a) => [a, sum(d.counts, s.since, today, [a], (x) => !x.startsWith('b:'))]).filter(([, n]) => n).map(([a, n]) => `${ACT[a]} ${n}`).join(' · ')})` : ''}</small></div>`);
  for (const b of d.buildings) {
    const live = b.status === 'live';
    const scans = sum(b.counts, b.liveSince || s.since, today, ['view']);
    const opens = sum(d.counts, s.since, today, null, (x) => x === `b:${b.id}`);
    ch.push(`<div class="ch"><b>เมนูบริการที่ ${esc(b.name)}</b><span class="pill${live ? ' on' : ''}">${live ? 'วางในอาคารแล้ว' : 'ยังไม่ได้วาง (ตัวอย่าง)'}</span>
      <small>${live ? `คนสแกนเปิดเมนู ${scans} ครั้ง · กดดูร้านคุณจากเมนู ${opens} ครั้ง` : 'ยังวัดไม่ได้ จนกว่าอาคารตกลงและวางเมนูจริง'}</small></div>`);
  }
  ch.push(s.bookeaseUrl
    ? `<div class="ch"><b>หน้าร้านบน bookease.co</b><span class="pill on">ขึ้นแล้ว</span><small><a href="${esc(s.bookeaseUrl)}" target="_blank" rel="noopener">${esc(s.bookeaseUrl.replace(/^https:\/\//, ''))}</a></small></div>`
    : `<div class="ch"><b>หน้าร้านบน bookease.co</b><span class="pill">ยังไม่ได้ขึ้น</span><small>จะขึ้นเมื่อร้านส่งเมนูและราคามาให้</small></div>`);
  ch.push(s.gbp
    ? `<div class="ch"><b>ตัวเลขจาก Google: คนเห็นร้านคุณ กดโทร กดนำทาง</b><span class="pill on">ได้แล้ว</span><small>${esc(s.gbp)}</small></div>`
    : `<div class="ch"><b>ตัวเลขจาก Google: คนเห็นร้านคุณ กดโทร กดนำทาง</b><span class="pill">ยังวัดไม่ได้</span><small>รอเจ้าของร้านเพิ่มเราเป็น “ผู้จัดการ” ร้านใน Google (ทำครั้งเดียว เราส่งรูปสอนให้ทาง LINE)</small></div>`);

  $('app').innerHTML = `
    <header class="top"><img src="../../brand/bookease-logo.svg" alt="bookease"><span>รายงานโปรโมทร้าน</span></header>
    <div class="title"><h1>${esc(s.name)}</h1><p>สัปดาห์ที่ ${week} · เริ่ม ${thDateY(s.since)} · อัปเดต ${thDateY(today)}</p></div>
    <div class="stats">${stats}</div>
    ${progress(hist)}
    <section class="card"><h2>งานที่เราทำให้ร้าน</h2>${logHtml}</section>
    <section class="card"><h2>ลูกค้าเห็นร้านคุณจากที่ไหนบ้าง</h2><p class="lead">ตัวเลขนับจริงทุกครั้ง · ถ้ายังนับไม่ได้ เราจะเขียนว่า “ยังวัดไม่ได้” · ถ้าไม่มีคนเลย จะเขียน 0</p><div class="chan">${ch.join('')}</div></section>
    ${STAFF ? `<section class="card staff"><h2>ส่งรายงานวันจันทร์ทาง LINE (สำหรับทีม)</h2>
      <p class="lead">1) ส่งรูปการ์ดนี้ให้ร้าน 2) ส่งลิงก์รายงานตามไป ร้านกดดูรายละเอียดจากลิงก์</p>
      <img id="cardimg" alt="การ์ดรายงานประจำสัปดาห์" style="width:100%;max-width:420px;display:block;border-radius:14px">
      <button id="share">ส่งรูปการ์ดทาง LINE</button> <button id="save" class="soft">บันทึกรูป</button> <button id="copylink" class="soft">คัดลอกลิงก์รายงาน</button> <span id="ok" hidden>คัดลอกแล้ว</span>
      <details style="margin-top:14px"><summary style="cursor:pointer;color:var(--ink-3);font-size:14px">ข้อความแบบยาว (ถ้าส่งรูปไม่ได้)</summary><textarea id="msg">${esc(lineText(d, week, from7, views7, contacts7))}</textarea><button id="copy">คัดลอกข้อความ</button></details></section>` : ''}
    <p class="foot">เราลองค้นใน Google แทนลูกค้า ตอนร้านเปิด · มือถือแต่ละเครื่องอาจเห็นลำดับต่างกันนิดหน่อย</p>`;
  if (STAFF) {
    const copy = async (text, onFail) => {
      try { await navigator.clipboard.writeText(text); $('ok').hidden = false; } catch (e) { console.error('[growth] copy', e); onFail && onFail(); }
    };
    $('copy').addEventListener('click', () => copy($('msg').value, () => $('msg').select()));
    $('copylink').addEventListener('click', () => copy(d.card.url));
    cardBlob(d.card).then((blob) => {
      const file = new File([blob], `bookease-${s.id.slice(-6)}-week${d.card.week}.png`, { type: 'image/png' });
      $('cardimg').src = URL.createObjectURL(blob);
      $('save').addEventListener('click', () => { const a = document.createElement('a'); a.href = $('cardimg').src; a.download = file.name; a.click(); });
      $('share').addEventListener('click', async () => {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== 'AbortError') console.error('[growth] share', e); }
        } else $('save').click(); // computer: save, then drag the picture into LINE
      });
    }).catch((e) => console.error('[growth] card', e));
  }
}

// ── The weekly card as a picture (the team sends it in LINE until the bot pushes the same card itself) ──
const seg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
function wrapLines(ctx, text, maxW) {
  const words = seg ? [...seg.segment(text)].map((x) => x.segment) : text.split(/(?<=\s)/);
  const lines = []; let line = '';
  for (const w of words) {
    if (ctx.measureText(line + w).width > maxW && line) { lines.push(line.trimEnd()); line = w.trimStart(); } else line += w;
  }
  if (line) lines.push(line);
  return lines;
}
async function cardBlob(c) {
  // Same layout as the LINE flex card: coloured top with the one piece of news, one more line, one button.
  await Promise.all(['400 30px Anuphan', '500 30px Anuphan', '700 60px Anuphan', '800 36px Inter'].map((f) => document.fonts.load(f)));
  const TONES = { up: ['#E6F4EA', '#0F5F2C'], down: ['#FDECEA', '#9F1D1D'], same: ['#F1EEEA', '#3F3935'], start: ['#EEF2FD', '#1E3A8A'], wait: ['#EEF2FD', '#1E3A8A'] };
  const [bg, ink] = TONES[c.tone] || TONES.same;
  const W = 1040, P = 56, canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
  const paint = (draw) => {
    let y = P;
    const text = (str, font, color, lh) => {
      ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const lines = wrapLines(ctx, str, W - 2 * P);
      lines.forEach((l, i) => draw && ctx.fillText(l, P, y + i * lh));
      y += lines.length * lh;
    };
    // top: the news, on the tone colour
    const topStart = 0;
    if (draw) { ctx.fillStyle = bg; ctx.fillRect(0, topStart, W, topH); }
    if (draw) { ctx.font = '800 36px Inter'; ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = '#0A0A0A'; ctx.fillText('book', P, y); const bw = ctx.measureText('book').width; ctx.fillStyle = '#2D55EB'; ctx.fillText('ease', P + bw, y); }
    y += 62;
    text(`${c.name} · สัปดาห์ที่ ${c.week}`, '500 28px Anuphan', ink, 40);
    y += 14;
    text(c.headline, '700 60px Anuphan', ink, 78);
    y += 8;
    text(c.sub, '400 30px Anuphan', ink, 44);
    y += P;
    const topEnd = y;
    // one more line, then the button
    y += 44;
    text(c.second, '500 34px Anuphan', '#14110F', 50);
    y += 40;
    if (draw) {
      ctx.fillStyle = '#2D55EB'; ctx.beginPath(); ctx.roundRect(P, y, W - 2 * P, 96, 48); ctx.fill();
      ctx.font = '700 34px Anuphan'; ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ดูรายละเอียด (ลิงก์ในแชท)', W / 2, y + 50);
    }
    y += 96 + P;
    return [y, topEnd];
  };
  let topH = 0;
  const [H, top] = paint(false);
  topH = top;
  canvas.width = W; canvas.height = H;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  paint(true);
  return new Promise((ok, no) => canvas.toBlob((b) => (b ? ok(b) : no(new Error('toBlob failed'))), 'image/png'));
}

function lineText(d, week, from7, views7, contacts7) {
  const s = d.shop, hist = d.hist, last = hist[hist.length - 1], prev = hist[hist.length - 2], first = hist[0];
  const done = d.log.filter((e) => e.at >= from7);
  const lines = [`รายงานร้าน ${s.name} · สัปดาห์ที่ ${week}`, '', 'สัปดาห์นี้เราทำอะไรให้ร้าน'];
  lines.push(...(done.length ? done.map((e) => `• ${e.what}`) : ['• สัปดาห์นี้ไม่มีงานใหม่ แต่เรายังนับผลให้ทุกวัน']));
  lines.push('', 'ผลที่นับได้');
  const was = (now, before) => (before == null ? ' (สัปดาห์แรก ไว้เทียบครั้งต่อไป)' : ` (สัปดาห์ก่อน ${before})`);
  if (last) {
    lines.push(`• คนค้นหาแถวร้าน เห็นร้านคุณใน 3 ร้านแรก ${last.spacings[0].top3} จาก 9 จุด${was(last.spacings[0].top3, prev && prev.spacings[0].top3)}`);
    lines.push(`• คนที่อยู่ไกลออกไป 2 กม. เห็นร้านคุณใน 3 ร้านแรก ${last.spacings[1].top3} จาก 9 จุด${was(last.spacings[1].top3, prev && prev.spacings[1].top3)}`);
    if (last.reviews != null) lines.push(`• รีวิว ${last.reviews}${first && first !== last ? ` (เพิ่ม ${last.reviews - first.reviews} ตั้งแต่เริ่ม)` : ''}`);
  } else lines.push('• ลำดับร้านใน Google: ยังวัดไม่ได้ เราจะลองค้นครั้งแรกตอนร้านเปิด');
  lines.push(`• คนเปิดดูหน้าร้าน ${views7} ครั้ง · กดโทร นำทาง หรือติดต่อร้าน ${contacts7} ครั้ง (7 วันล่าสุด)`);
  const pending = [];
  if (!s.gbp) pending.push('ตัวเลขจาก Google (รอเจ้าของร้านเพิ่มเราเป็นผู้จัดการร้าน)');
  for (const b of d.buildings) if (b.status !== 'live') pending.push(`เมนูที่ ${b.name} (ยังไม่ได้วาง)`);
  if (pending.length) lines.push('', `ยังวัดไม่ได้: ${pending.join(' · ')}`);
  lines.push('', `ดูทั้งหมด: ${location.origin}${location.pathname}?p=${s.id}`);
  return lines.join('\n');
}

async function load() {
  if (!/^[A-Za-z0-9_-]{10,200}$/.test(P)) { $('app').innerHTML = '<p class="err">ไม่พบร้าน</p>'; return; }
  const r = await fetch(`${API}/growth?p=${encodeURIComponent(P)}`);
  const d = await r.json();
  if (r.status === 404) { $('app').innerHTML = '<p class="err">ร้านนี้ยังไม่ได้เริ่มบริการโปรโมทร้าน</p>'; return; }
  if (!r.ok) throw new Error(d.error || r.status);
  render(d);
}
load().catch((e) => { console.error('[growth] load', e); $('app').innerHTML = '<p class="err">เปิดรายงานไม่ได้ ลองกดเปิดลิงก์ใหม่อีกครั้ง</p>'; });
</script>
