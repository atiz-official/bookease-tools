<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Radar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0A0A;--ink-2:#3B4250;--ink-3:#6B7383;--line:#E6E9EF;--ground:#F3F5F8;--card:#fff;--blue:#2D55EB;
  --r-bg1:#0E2A1D;--r-bg2:#05110B;--r-ring:rgba(74,222,128,.32);--r-hi:#4ADE80;--good:#16A34A;--good-soft:#E7F6EC}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ground)}
body{font-family:Sarabun,Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:20px 24px 48px}
.top{display:flex;align-items:baseline;gap:10px;min-height:32px}
.top img{display:block}
.top .prod{display:inline-block;white-space:nowrap;font:500 15px Inter;color:var(--ink-3);padding-left:10px;border-left:1.5px solid var(--line);line-height:1.2}
.mark{position:relative;display:inline-block;width:22px;height:22px;margin-right:7px;vertical-align:-5px;border-radius:50%;overflow:hidden;flex:none;
  background:repeating-radial-gradient(circle,transparent 0 3.5px,var(--r-ring) 3.5px 4.3px),radial-gradient(circle,var(--r-bg1),var(--r-bg2) 72%)}
.mark::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent 0 280deg,rgba(74,222,128,.75) 359deg,transparent 360deg);animation:spin 3.6s linear infinite}

/* search */
.find{max-width:560px;margin:6vh auto 0;display:flex;flex-direction:column;gap:12px}
.find h1{font:800 30px Sarabun;letter-spacing:-.01em}
.field{display:flex;gap:10px;align-items:center}
.box input{flex:1 1 0;min-width:0;border:1.5px solid #D5DAE2;border-radius:14px;padding:13px 14px;font:500 16px Sarabun;background:#fff;color:var(--ink)}
.box input:focus{outline:none;border-color:#9AA3B2}
.box input::placeholder{color:#7A8190}
.box{position:relative}
.box input{width:100%;padding-right:52px}
.go-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink-3);display:grid;place-items:center;cursor:pointer}
.go-btn:hover{background:var(--ground);color:var(--ink)}
.go-btn:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.go-btn svg{width:20px;height:20px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,20%{opacity:0}24%{opacity:1}70%{opacity:.15}100%{opacity:0}}

/* guide */
.guide{margin-top:64px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.tab{position:relative;flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:600 14.5px Sarabun;color:var(--ink-2);cursor:pointer;overflow:hidden}
.tab.on{color:var(--ink);border-color:#C9CFD9}
.tab .prog{position:absolute;left:0;bottom:0;height:2.5px;width:100%;background:var(--good);transform-origin:left;transform:scaleX(0)}
.tab.on .prog{animation:prog var(--dur) linear forwards}
.guide:hover .tab.on .prog{animation-play-state:paused}
@keyframes prog{to{transform:scaleX(1)}}
.board{display:grid;grid-template-columns:1.2fr .58fr 1.3fr;gap:28px;background:var(--card);border-radius:28px;padding:20px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -16px rgba(16,24,40,.12)}
.fade{transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.board.swap .fade{opacity:0;transform:translateY(8px)}

.scope-wrap{position:relative;display:flex;flex-direction:column;gap:8px}
.key{display:flex;gap:16px;font:600 13px Sarabun;color:var(--ink-3)}
.key span{display:inline-flex;align-items:center;gap:6px}
.k-dot{width:8px;height:8px;border-radius:50%;background:rgba(45,85,235,.6);box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #D5DAE2}
.k-pin{width:18px;height:18px;border-radius:50%;background:var(--good);border:0;font:800 10px Inter;color:#fff;display:grid;place-items:center;font-style:normal}
.row{cursor:default}.row.hot{background:#F3FBF6}
.scope{position:relative;border-radius:18px;overflow:hidden;background:#E8ECF1;aspect-ratio:1.15}
.scope iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:saturate(.45) contrast(.95);pointer-events:none}
.scope .ov{position:absolute;inset:0}
.sd,.lp{cursor:pointer;border:0;padding:0}
.sd:hover{background:var(--blue);transform:scale(1.5)}
.pop{position:absolute;z-index:40;width:228px;background:#fff;border-radius:14px;padding:12px 14px 12px;box-shadow:0 10px 30px -8px rgba(16,24,40,.35);font:500 13px Sarabun;color:var(--ink-2)}
.pop b{display:block;font:700 15px Sarabun;color:var(--ink);line-height:1.3;margin:0 18px 4px 0}
.pop .rk{display:inline-block;font:800 11.5px Inter;color:#fff;background:var(--good);border-radius:999px;padding:1px 8px;margin-bottom:6px}
.pop .rk.no{background:#9AA3B2}
.pop .pp{display:flex;gap:2px;margin:6px 0}.pop .pp i{width:14px;height:8px;border-radius:2px;background:#E8EBF0}.pop .pp i.on{background:var(--good)}
.pop a{display:inline-block;margin-top:6px;color:var(--blue);font-weight:700;text-decoration:none}
.pop .x{position:absolute;right:8px;top:6px;border:0;background:none;font:600 18px Inter;color:#9AA3B2;cursor:pointer;line-height:1}
.row{cursor:pointer}
.sd{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:rgba(45,85,235,.55);box-shadow:0 0 0 1.5px #fff}
.lp{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--good);color:#fff;font:800 12px Inter;display:grid;place-items:center;
  box-shadow:0 0 0 2.5px #fff,0 2px 6px rgba(16,24,40,.3);transition:transform .25s ease}
.lp.hot{transform:scale(1.35)}
.scope .where{position:absolute;left:10px;top:10px;font:700 13px Sarabun;color:var(--ink);background:rgba(255,255,255,.92);border-radius:999px;padding:3px 10px}

.nums{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:4px 0}
.num b{display:block;font:800 46px Inter;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.num span{font:600 15px Sarabun;color:var(--ink-2)}
.num.hot b{color:var(--good)}

.lead h2{font:800 21px Sarabun;color:var(--ink);letter-spacing:-.01em;line-height:1.3;margin:2px 0 8px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);
  opacity:0;transform:translateX(-6px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.row.in{opacity:1;transform:none}
.row:last-child{border-bottom:0}
.row .i{font:800 13px Inter;color:#A0A7B4}
.row .nm{font:600 15px Sarabun;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:2px}
.pips i{width:6px;height:14px;border-radius:2px;background:#E8EBF0}
.pips i.on{background:var(--good)}
.row small{font:600 12.5px Inter;color:var(--ink-3);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.tip{font:700 13.5px Sarabun;color:#14532D;background:var(--good-soft);border-radius:999px;padding:6px 12px}
.src{margin-top:14px;font:500 12px Sarabun;color:#9097A5;text-align:center}

@media (max-width:980px){.board{grid-template-columns:1fr 1fr}.scope-wrap{grid-column:1 / -1}.scope{aspect-ratio:1.8}}
@media (max-width:620px){.board{grid-template-columns:1fr;padding:14px;border-radius:22px}.scope{aspect-ratio:1.3}.nums{flex-direction:row;justify-content:space-between}.num b{font-size:32px}.num span{font-size:13px}.find h1{font-size:26px}.row{grid-template-columns:18px 1fr;row-gap:4px}.row .meta{grid-column:2;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){.mark::after{animation:none}.fade,.row{transition:none}.tab.on .prog{animation:none;transform:scaleX(1)}}
</style></head><body>

   see first as numbered pins, placed by Web Mercator maths at the same zoom */
const scope = $('.scope');
let hot = -1, cur_a = null, held = false;
function px(dla, dlo, lat, z) {
  const s = 256 * Math.pow(2, z), la = lat + dla, r = (v) => v * Math.PI / 180;
  const y = (v) => (1 - Math.log(Math.tan(r(v)) + 1 / Math.cos(r(v))) / Math.PI) / 2 * s;
  return { dx: dlo / 360 * s, dy: y(la) - y(lat) };
}
function setDots(a) {
  cur_a = a; held = false;
  const W = scope.clientWidth, H = scope.clientHeight; lastW = W;
  // zoom in as far as the 1 km circle around the landmark still fits
  let z = 16;
  while (z > 12) { const o = px(0.009, 0.0093, a.lat, z); if (Math.abs(o.dx) * 2 < W && Math.abs(o.dy) * 2 < H) break; z--; }
  const dots = a.dots.map(([dla, dlo, nm], j) => { const o = px(dla, dlo, a.lat, z); return `<button class="sd" data-d="${j}" aria-label="${nm.replace(/"/g, '')}" style="left:calc(50% + ${o.dx.toFixed(1)}px);top:calc(50% + ${o.dy.toFixed(1)}px)"></button>`; }).join('');
  const pins = a.leaders.map((l, i) => {
    if (!l.at) return '';
    const o = px(l.at[0], l.at[1], a.lat, z);
    if (Math.abs(o.dx) > W / 2 - 10 || Math.abs(o.dy) > H / 2 - 10) return '';
    return `<button class="lp" data-i="${i}" aria-label="อันดับ ${i + 1} ${l.name.replace(/"/g, '')}" style="left:calc(50% + ${o.dx.toFixed(1)}px);top:calc(50% + ${o.dy.toFixed(1)}px);z-index:${20 - i}">${i + 1}</button>`;
  }).join('');
  scope.innerHTML = `<iframe title="แผนที่ ${a.hub}" src="https://maps.google.com/maps?q=${a.lat},${a.lng}&z=${z}&t=m&hl=th&output=embed"></iframe>`
    + `<div class="ov">${dots}${pins}</div><span class="where">${a.hub}</span>`;
}
const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function openCard(node, html) {
  closeCard();
  const ov = scope.parentElement, r = scope.getBoundingClientRect(), n = node.getBoundingClientRect();
  const card = document.createElement('div'); card.className = 'pop'; card.setAttribute('role', 'dialog');
  card.innerHTML = `<button class="x" aria-label="ปิด">×</button>${html}`;
  ov.appendChild(card);
  const x = Math.min(Math.max(n.left - r.left - card.offsetWidth / 2 + n.width / 2, -4), r.width - card.offsetWidth + 4);
  const below = n.top - r.top < card.offsetHeight + 16;
  card.style.left = `${x}px`;
  card.style.top = `${below ? n.bottom - r.top + 8 : n.top - r.top - card.offsetHeight - 8}px`;
  held = true;
}
function closeCard() { scope.parentElement.querySelectorAll('.pop').forEach((p) => p.remove()); held = false; }
const pips = (n) => `<span class="pp">${Array.from({ length: 9 }, (_, j) => `<i class="${j < n ? 'on' : ''}"></i>`).join('')}</span>`;
function leaderCard(i) {
  const l = cur_a.leaders[i];
  return `<span class="rk">อันดับ ${i + 1} ในย่าน</span><b>${esc(l.name)}</b>${pips(l.n)}ติด 3 อันดับแรก ${l.n} ใน 9 พื้นที่ค้นหา<br>`
    + `${l.rating ? '★ ' + l.rating : ''}${l.reviews != null ? ' · ' + l.reviews.toLocaleString('en-US') + ' รีวิว' : ''}<br><a href="${esc(l.url)}" target="_blank" rel="noopener">เปิดใน Google Maps ↗</a>`;
}
function dotCard(j) {
  const [, , nm, n] = cur_a.dots[j];
  return n ? `<span class="rk">ติด 3 อันดับแรก ${n} ใน 9 พื้นที่ค้นหา</span><b>${esc(nm)}</b>${pips(n)}`
           : `<span class="rk no">ไม่ติด 3 อันดับแรกเลย</span><b>${esc(nm)}</b>ใน 9 พื้นที่ค้นหา`;
}
scope.parentElement.addEventListener('click', (e) => {
  const lp = e.target.closest('.lp'), sd = e.target.closest('.sd');
  if (e.target.closest('.x')) { closeCard(); return; }
  if (lp) { openCard(lp, leaderCard(+lp.dataset.i)); return; }
  if (sd) { openCard(sd, dotCard(+sd.dataset.d)); return; }
  if (!e.target.closest('.pop')) closeCard();
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCard(); });

function markHot() { scope.querySelectorAll('.lp').forEach((p) => p.classList.toggle('hot', +p.dataset.i === hot)); }
let lastW = 0;
addEventListener('resize', () => { const w = scope.clientWidth; if (cur_a && Math.abs(w - lastW) > 30) setDots(cur_a); });

/* tabs + auto play */
const tabs = $('.tabs');
tabs.innerHTML = D.areas.map((a, i) => `<button class="tab" role="tab" data-i="${i}">${a.name}<span class="prog"></span></button>`).join('');
tabs.style.setProperty('--dur', DUR + 'ms');
let cur = -1, timer = null, hover = false;
function show(i) {
  cur = i;
  const a = D.areas[i];
  [...tabs.children].forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-selected', j === i); });
  const on = tabs.children[i]; void on.offsetWidth;
  on.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  const board = $('.board');
  board.classList.add('swap');
  setTimeout(() => {
    setDots(a);
    document.querySelectorAll('[data-k]').forEach((el) => countUp(el, a[el.dataset.k]));
    const rows = $('.rows');
    rows.innerHTML = a.leaders.map((l, k) => `<div class="row"><span class="i">${k + 1}</span><span class="nm" title="${l.name}">${l.name}</span>
      <span class="meta"><span class="pips" aria-label="ติด 3 อันดับแรก ${l.n} ใน 9 พื้นที่ค้นหา">${Array.from({ length: 9 }, (_, j) => `<i class="${j < l.n ? 'on' : ''}"></i>`).join('')}</span>
      <small>${l.rating ? '★' + l.rating : ''}${l.reviews != null ? ' · ' + fmt(l.reviews) : ''}</small></span></div>`).join('');
    [...rows.children].forEach((r, k) => {
      setTimeout(() => r.classList.add('in'), reduce ? 0 : 120 + k * 110);
      r.addEventListener('mouseenter', () => { hot = k; r.classList.add('hot'); markHot(); });
      r.addEventListener('mouseleave', () => { hot = -1; r.classList.remove('hot'); markHot(); });
      r.addEventListener('click', () => { const p = scope.querySelector(`.lp[data-i="${k}"]`); if (p) openCard(p, leaderCard(k)); });
    });
    $('.lead h2').textContent = `TOP 5 ร้านในย่าน${a.name}`;
    const tip = $('.tip'); tip.textContent = a.insight || ''; tip.hidden = !a.insight;
    board.classList.remove('swap');
  }, reduce ? 0 : 380);
  clearTimeout(timer); timer = setTimeout(next, DUR);
}
function next() { if (hover || held || document.hidden) { timer = setTimeout(next, 500); return; } show((cur + 1) % D.areas.length); }
tabs.addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) show(+b.dataset.i); });
$('.guide').addEventListener('mouseenter', () => { hover = true; });
$('.guide').addEventListener('mouseleave', () => { hover = false; });
show(0);
</script>
</body></html>
