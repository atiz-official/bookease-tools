<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ใบฝากร้าน · bookease</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Anuphan:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9E5E1;font-family:Anuphan,Inter,sans-serif;color:#14110F;-webkit-font-smoothing:antialiased}
.sheet{width:210mm;height:297mm;margin:0 auto;background:#fff;padding:18mm 16mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{height:11mm}
.photo{width:100%;height:62mm;border-radius:6mm;background:#F3F0EC center/cover;margin-top:10mm}
h1{font:800 13mm/1.15 Anuphan;margin-top:8mm;text-wrap:balance}
.sub{font:600 6mm/1.4 Anuphan;color:#4A4440;margin-top:3mm}
#qr{margin-top:9mm;padding:5mm;border:1.2mm solid #2D55EB;border-radius:6mm;background:#fff}
#qr img,#qr canvas{display:block;width:62mm!important;height:62mm!important}
.scan{font:800 7.5mm/1.3 Anuphan;margin-top:6mm;text-wrap:balance}
.url{font:700 5.2mm Inter;color:#2D55EB;margin-top:2mm;letter-spacing:.02em}
.foot{margin-top:auto;font:600 4.4mm/1.5 Anuphan;color:#7A726C}
.err{padding:30px;color:#B91C1C}
@media print{body{background:#fff}.sheet{margin:0}}
</style>
</head>
<body>
<div class="sheet" id="sheet"><p>กำลังเตรียมใบฝากร้าน…</p></div>
<script>
// One A4 sheet left at the shop: its own QR opens its sales kit. Print from the browser (A4, no margins).
const API = 'https://bookease-maps-report.atiz-cloudflare-account.workers.dev';
const qs = new URLSearchParams(location.search);
const P = qs.get('p') || '', CAT = qs.get('c') || '', AREA = qs.get('a') || '';
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function load() {
  if (!/^[A-Za-z0-9_-]{10,200}$/.test(P)) throw new Error('bad_place');
  const r = await fetch(API + '/place', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ placeId: P }) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  const own = (d.photos || []).find((ph) => ph.by === d.name) || (d.photos || [])[0];
  const kit = new URL('https://radar.bookease.co/kit/');
  kit.searchParams.set('p', P); if (CAT) kit.searchParams.set('c', CAT); if (AREA) kit.searchParams.set('a', AREA);
  kit.searchParams.set('v', 'qr');
  document.title = `ใบฝากร้าน · ${d.name}`;
  document.getElementById('sheet').innerHTML = `
    <img class="logo" src="../../brand/bookease-logo.svg" alt="bookease">
    <div class="photo" style="${own ? `background-image:url('${API}/photo?w=1200&name=${encodeURIComponent(own.name)}')` : ''}"></div>
    <h1>${esc(d.name)}</h1>
    <p class="sub">เราทำตัวอย่างหน้าร้านและการโปรโมตของร้านพี่มาให้ดูแล้ว</p>
    <div id="qr" role="img" aria-label="QR เปิดชุดโปรโมตร้าน"></div>
    <p class="scan">สแกนดูชุดโปรโมตร้าน${esc(d.name)}</p>
    <p class="url">radar.bookease.co</p>
    <p class="foot">bookease · โปรโมทร้านให้ฟรี · 092-641-4296</p>`;
  new QRCode(document.getElementById('qr'), { text: kit.toString(), width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
}
load().catch((e) => { console.error('[leave] load', e); document.getElementById('sheet').innerHTML = '<p class="err">เตรียมใบฝากร้านไม่ได้ ลองเปิดลิงก์ใหม่อีกครั้ง</p>'; });
</script>
</body>
</html>
