# Deploy: npx wrangler deploy   (auth: `npx wrangler login`, or CLOUDFLARE_API_TOKEN)
# Secret: GOOGLE_PLACES_KEY  →  npx wrangler secret put GOOGLE_PLACES_KEY
# Payments (growth-pay.js, need Art's OK): XENDIT_SECRET_KEY (collect key only), GROWTH_ADMIN_TOKEN, optional XENDIT_CALLBACK_TOKEN; var GROWTH_PAY=on
name = "bookease-maps-report"
main = "worker.js"
compatibility_date = "2026-05-05"
account_id = "b8da7782d6a1a500d9789844a4c3ce8a"
workers_dev = true

# Saved reports (7 days) and the daily count of new reports. Created 2026-11-15:
#   npx wrangler kv namespace create RADAR_REPORTS
# BookEase Growth weekly rank check: every 15 min, 10:00–19:45 Bangkok (UTC+7), one due shop per run.
[triggers]
# Growth payments: re-check open Xendit invoices every 10 min (covers a lost webhook). Inert unless GROWTH_PAY=on.
crons = ["*/15 3-12 * * *", "*/10 * * * *"]

[[kv_namespaces]]
binding = "REPORTS"
id = "c3bb5ce38cea4b68a9b56de03b53a179"

# Contact and view counts for BookEase Growth (atomic +1; KV lost updates under concurrent taps). Created 2026-11-16.
# Schema: growth-schema.sql  →  npx wrangler d1 execute bookease-growth --remote --file growth-schema.sql
[[d1_databases]]
binding = "GROWTH_DB"
database_name = "bookease-growth"
database_id = "89fa7df7-e8ff-4eec-b816-66db19942031"
